---
- name: Generate SAOS10 module
  hosts: localhost
  vars:
    ansible_collection_root: /home/{{ansible_user_id}}/src/ansible_collections
    saos10:
      modules:
        # - classifiers
        # - fds
        # - fps
        # - bgp
        - logical-ports
        # - isis
        # - ldp
        - mpls
        - ospf
        - ospfv3
        - otn-ports
        # - routing-policy
        - rib
        - xcvrs
        - system
        - ptps
        - flexe
        - g8032-rings
        - otn-ports
        - segment-routing-traffic-engineering
    overwrite: true
  tasks:
    - name: Run execution
      ansible.builtin.include_tasks: playbook_tasks.yml
      vars:
        product: saos10
      with_items: "{{ saos10.modules }}"
