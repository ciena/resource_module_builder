- name: Check to see if {{ template['destination'] }} exists
  stat:
    path: "{{ template['destination'].replace('-','_') }}"
  register: file_stat

- name: Create the {{ template['destination'] }} file, if it doesnt exist already or override is set
  template:
    src: "{{ template['source'] }}"
    dest: "{{ template['destination'].replace('-','_') }}"
  when: not file_stat.stat.exists or template['overwrite']
