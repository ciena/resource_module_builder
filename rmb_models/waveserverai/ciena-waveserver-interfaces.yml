DOCUMENTATION:
  module: waveserverai_waveserver_interfaces
  short_description: Manage waveserver_interfaces on Ciena waveserverai devices.
  description: Top level container for configuration and operational data for physical and logical network interfaces.
  author: Ciena
  options:
    config:
      acl:
        description: Top-level container for Network Access Control List configuration.
        type: dict
        suboptions:
          egress:
            description: Configuration data for interface egress ACLs.
            type: dict
            suboptions:
              acl_ipv4:
                description: IP-layer ACLs with IPv4 addresses
                type: list
                elements: dict
                suboptions:
                  sequence_id:
                    description: 'The sequence id determines the priority in which ACL entries are applied. The sequece id must be unique in the
                      ACL. (Key for list: acl-ipv4)'
                    type: int
                    required: true
                  action:
                    description: The forwarding action defined for packets matching the filtering rules for this ACL entry.
                    type: str
                    required: false
                    choices:
                    - allow
                    - drop
                  destination_address:
                    description: The destination IPv4 address and optional prefix length for this ACL entry.
                    type: str
                    required: false
                  destination_port:
                    description: The L4 destination port for this ACL entry.
                    type: int
                    required: false
                  interface_name:
                    description: The name of the logical management interface that the ACL entry is applied to, e.g. 'local'.
                    type: str
                    required: false
                  protocol:
                    description: The transport protocol of the IPv4 packet to match. A value of 0 matches ALL protocols, 1=ICMP, 58=ICMPv6, 6=TCP,
                      and 17=UDP.
                    type: int
                    required: false
                  source_address:
                    description: The source IPv4 address and optional prefix length for this ACL entry.
                    type: str
                    required: false
                  source_port:
                    description: The L4 source port for this ACL entry.
                    type: int
                    required: false
                key: sequence-id
              acl_ipv6:
                description: IP-layer ACLs with IPv6 addresses
                type: list
                elements: dict
                suboptions:
                  sequence_id:
                    description: 'The sequence id determines the priority in which ACL entries are applied. The sequece id must be unique in the
                      ACL. (Key for list: acl-ipv6)'
                    type: int
                    required: true
                  action:
                    description: The forwarding action defined for packets matching the filtering rules for this ACL entry.
                    type: str
                    required: false
                    choices:
                    - allow
                    - drop
                  destination_address:
                    description: The destination IPv6 address and optional prefix length for this ACL entry.
                    type: str
                    required: false
                  destination_port:
                    description: The L4 destination port for this ACL entry.
                    type: int
                    required: false
                  interface_name:
                    description: The name of the logical management interface that the ACL entry is applied to, e.g. 'local'.
                    type: str
                    required: false
                  protocol:
                    description: The transport protocol of the IPv6 packet to match. A value of 0 matches ALL protocols, 1=ICMP, 6=TCP, and 17=UDP.
                    type: int
                    required: false
                  source_address:
                    description: The source IPv6 address and optional prefix length for this ACL entry.
                    type: str
                    required: false
                  source_port:
                    description: The L4 source port for this ACL entry.
                    type: int
                    required: false
                key: sequence-id
          ingress:
            description: Configuration data for interface ingress ACLs.
            type: dict
            suboptions:
              acl_ipv4:
                description: IP-layer ACLs with IPv4 addresses
                type: list
                elements: dict
                suboptions:
                  sequence_id:
                    description: 'The sequence id determines the priority in which ACL entries are applied. The sequece id must be unique in the
                      ACL. (Key for list: acl-ipv4)'
                    type: int
                    required: true
                  action:
                    description: The forwarding action defined for packets matching the filtering rules for this ACL entry.
                    type: str
                    required: false
                    choices:
                    - allow
                    - drop
                  destination_address:
                    description: The destination IPv4 address and optional prefix length for this ACL entry.
                    type: str
                    required: false
                  destination_port:
                    description: The L4 destination port for this ACL entry.
                    type: int
                    required: false
                  interface_name:
                    description: The name of the logical management interface that the ACL entry is applied to, e.g. 'local'.
                    type: str
                    required: false
                  protocol:
                    description: The transport protocol of the IPv4 packet to match. A value of 0 matches ALL protocols, 1=ICMP, 58=ICMPv6, 6=TCP,
                      and 17=UDP.
                    type: int
                    required: false
                  source_address:
                    description: The source IPv4 address and optional prefix length for this ACL entry.
                    type: str
                    required: false
                  source_port:
                    description: The L4 source port for this ACL entry.
                    type: int
                    required: false
                key: sequence-id
              acl_ipv6:
                description: IP-layer ACLs with IPv6 addresses
                type: list
                elements: dict
                suboptions:
                  sequence_id:
                    description: 'The sequence id determines the priority in which ACL entries are applied. The sequece id must be unique in the
                      ACL. (Key for list: acl-ipv6)'
                    type: int
                    required: true
                  action:
                    description: The forwarding action defined for packets matching the filtering rules for this ACL entry.
                    type: str
                    required: false
                    choices:
                    - allow
                    - drop
                  destination_address:
                    description: The destination IPv6 address and optional prefix length for this ACL entry.
                    type: str
                    required: false
                  destination_port:
                    description: The L4 destination port for this ACL entry.
                    type: int
                    required: false
                  interface_name:
                    description: The name of the logical management interface that the ACL entry is applied to, e.g. 'local'.
                    type: str
                    required: false
                  protocol:
                    description: The transport protocol of the IPv6 packet to match. A value of 0 matches ALL protocols, 1=ICMP, 6=TCP, and 17=UDP.
                    type: int
                    required: false
                  source_address:
                    description: The source IPv6 address and optional prefix length for this ACL entry.
                    type: str
                    required: false
                  source_port:
                    description: The L4 source port for this ACL entry.
                    type: int
                    required: false
                key: sequence-id
      bgp:
        description: Waveserver Border Gateway Protocol (BGP) configuration data and peer information.
        type: dict
        suboptions:
          peer:
            description: A list of BGP peers. BGP peers are created by the system when BGP is enabled. Users are not allowed to create or delete
              peers
            type: list
            elements: dict
            suboptions:
              name:
                description: 'Peer name. Read-only attribute. (Key for list: peer)'
                type: str
                required: true
                choices:
                - peer-1
                - peer-2
              autonomous_system:
                description: Autonomous system number of the peer.
                type: int
                required: false
              interface:
                description: The name of the peer interface, e.g. 'dcn', 'ilan-1'.
                type: str
                required: false
              ip:
                description: IP address of peer.
                type: str
                required: false
            key: name
          properties:
            description: BGP properties.
            type: dict
            suboptions:
              autonomous_system:
                description: This is the autonomous system number which is an identification number for the node. An autonomous system is a group
                  of networks under a common administration. Each node within that group gets an AS number.
                type: int
                required: false
              holdoff_time:
                description: The time in seconds that the node waits to receive a keep-alive message. If the node does not receive a keep-alive
                  within the hold-off time, it will mark the BGP connection as down. The hold-off timer should be set to at least 3 times the
                  keep-alive timer.
                type: int
                required: false
              keep_alive_time:
                description: The time in seconds between sending a keep-alive heartbeat between BGP nodes.
                type: int
                required: false
          state:
            description: BGP state information.
            type: dict
            suboptions:
              admin_state:
                description: Whether Admin State is enabled or disabled for BGP protocol.
                type: str
                required: false
                choices:
                - disabled
                - enabled
      logical_interface:
        description: List of logical IP management interfaces (e.g. 'local').
        type: list
        elements: dict
        suboptions:
          name:
            description: 'References the system-assigned name of the logical interface. (Key for list: logical-interface)'
            type: str
            required: true
          id:
            description: Identification information of this logical management interface.
            type: dict
            suboptions:
              name:
                description: The name of the logical management interface, e.g. 'local'.
                type: str
                required: false
          properties:
            description: All the configuration data of the logical management interface.
            type: dict
            suboptions:
              ipv4:
                description: IPv4 configuration and operational data. It only applies to external interfaces
                type: dict
                suboptions:
                  admin_state:
                    description: Whether IPv4 stack is enabled or disabled on this interface. Always enabled for the local management interface.
                    type: str
                    required: false
                    choices:
                    - disabled
                    - enabled
                  backup_gateway:
                    description: The user-configured backup IPv4 gateway on the interface.
                    type: str
                    required: false
                  user_gateway:
                    description: The user-configured primary IPv4 gateway on the interface.
                    type: str
                    required: false
                  user_ip_address:
                    description: The user-configured IPv4 address and prefix on the interface.
                    type: str
                    required: false
              ipv6:
                description: IPv6 configuration and operational data. It only applies to external interfaces
                type: dict
                suboptions:
                  gateway_configuration:
                    description: All the configuration data of IPv6 gateway.
                    type: dict
                    suboptions:
                      ip_address:
                        description: The user-configured IPv6 gateway on the interface.
                        type: str
                        required: false
                      source:
                        description: The IPv6 gateway address type.
                        type: str
                        required: false
                        choices:
                        - manual
                        - dhcp
                        - apipa
                        - dhcpv6
                        - slaac
                        - local
                  user_ip_address:
                    description: List of provisioned IPv6 addresses.
                    type: list
                    elements: dict
                    suboptions:
                      ip_address:
                        description: 'The user-configured IPv6 address and prefix on the interface. (Key for list: user-ip-address)'
                        type: str
                        required: true
                    key: ip-address
          state:
            description: Logical interface state information.
            type: dict
            suboptions:
              admin_state:
                description: Whether Admin State is enabled or disabled for this management interface.
                type: str
                required: false
                choices:
                - disabled
                - enabled
        key: name
      physical_interface:
        description: List of physical Ethernet management interfaces (or interface ports).
        type: list
        elements: dict
        suboptions:
          name:
            description: 'References the system-assigned name of the interface. (Key for list: physical-interface)'
            type: str
            required: true
          id:
            description: Identification information of this management interface.
            type: dict
            suboptions:
              name:
                description: The system-assigned name of the physical interface (e.g. ifp0-dcn-1, ifp0-ilan-1, ifp0-1-1, etc.). The names are
                  predefined.
                type: str
                required: false
          properties:
            description: All the configuration data of the physical management interface.
            type: dict
            suboptions: {}
          state:
            description: Physical management interface state information.
            type: dict
            suboptions:
              admin_state:
                description: Whether Admin State is enabled or disabled for this management interface.
                type: str
                required: false
                choices:
                - disabled
                - enabled
        key: name
      routes:
        description: Top-level container for IP route configuration and operational data.
        type: dict
        suboptions:
          ipv4_static_route:
            description: List of IPv4 static routing entries.
            type: list
            elements: dict
            suboptions:
              destination:
                description: 'IPv4 route destination prefix for the static route. Only one static routing entry per unique destination ip/prefix
                  can be configured. (Key for list: ipv4-static-route)'
                type: str
                required: true
              next_hop:
                description: A list of next-hop entries associated with the static route.
                type: list
                elements: dict
                suboptions:
                  index:
                    description: 'The index key of the entry in the next-hop list. Currently only one static entry is supported per destination
                      prefix, so the index should always be 1. (Key for list: next-hop)'
                    type: int
                    required: true
                  associated_interface:
                    description: Reference to the associated logical-interface name of the route entry. Defaults to the 'local' interface for
                      routes within the subnet associated with the active IP address configured on the local management interface.
                    type: str
                    required: false
                  ip_address:
                    description: IPv4 route next-hop or gateway address associated with the route. If not specified, the default gateway value
                      for the local management interface will be used.
                    type: str
                    required: false
                  metric:
                    description: Routing metric cost.
                    type: int
                    required: false
                key: index
            key: destination
          ipv6_static_route:
            description: List of IPv6 static routing entries.
            type: list
            elements: dict
            suboptions:
              destination:
                description: 'IPv6 route destination prefix for the static route. Only one static routing entry per unique destination ip/prefix
                  can be configured. (Key for list: ipv6-static-route)'
                type: str
                required: true
              gateway:
                description: 'IPv6 route gateway address associated with the route. If not specified, the default gateway value for the local
                  management interface will be used. (Key for list: ipv6-static-route)'
                type: str
                required: true
              metric:
                description: 'Routing metric cost. (Key for list: ipv6-static-route)'
                type: int
                required: true
              associated_interface:
                description: Reference to the associated logical-interface name of the route entry. Defaults to the 'local' interface for routes
                  within the subnet associated with the active IP address configured on the local management interface.
                type: str
                required: false
            key: destination gateway metric
      stacks:
        description: Top-level container for IP stacks configuration and operational data.
        type: dict
        suboptions:
          ipv6_stack_state:
            description: IPv6 stack state configuration and operational data.
            type: dict
            suboptions:
              accept_router_advertisement:
                description: Whether accept the router advertisement.
                type: bool
                required: false
              max_slaac_addresses:
                description: Max number of the SLAAC addresses.
                type: int
                required: false
              preference:
                description: Interface stack preference. IPv4 or IPv6.
                type: str
                required: false
                choices:
                - ipv4
                - ipv6
              state:
                description: IPv6 stack state.
                type: str
                required: false
                choices:
                - disabled
                - enabled
    state:
      description: The state of the configuration after module completion.
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
