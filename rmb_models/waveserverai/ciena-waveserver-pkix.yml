  author: Ciena
  options:
    config:
      description: A backward compatibility option to re-enable 2048bit RSA key length support.
      type: dict
      suboptions:
        admin_state:
          description: Indicate whether backward compatibility to support 2048bit RSA key length is enabled.
          type: str
          required: false
          choices:
          - disabled
          - enabled
    state:
      description: The state of the configuration after module completion.
      type: str
      choices:
      - merged
      - deleted
      default: merged
