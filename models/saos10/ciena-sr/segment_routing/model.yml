GENERATOR_VERSION: '2.0'
NETWORK_OS: saos10
RESOURCE: segment-routing
XML_NAMESPACE: http://ciena.com/ns/yang/ciena-sr
XML_ROOT_KEY: segment-routing
XML_ITEMS: srgb
XML_ITEMS_KEY: lower-bound upper-bound
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: saos10_segment_routing
  short_description: Segment routing global configManage the segment_routing srgb configuration of a Ciena saos10 device
  description: "Segment routing global config\n List of global blocks to be advertised"
  author: Ciena
  options:
    config:
      description: List of global blocks to be advertised
      type: list
      elements: dict
      key: lower-bound upper-bound
      suboptions:
        lower_bound:
          description: 'Lower value in the block (Key for list: srgb)'
          type: int
          required: true
        upper_bound:
          description: 'Upper value in the block (Key for list: srgb)'
          type: int
          required: true
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
