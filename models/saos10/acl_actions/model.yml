GENERATOR_VERSION: '2.0'
NETWORK_OS: saos10
RESOURCE: acl-actions
XML_NAMESPACE: urn:ciena:params:xml:ns:yang:ciena-pn::ciena-mef-access-flow
XML_ROOT_KEY: acl-actions
XML_ITEMS: acl-action
XML_ITEMS_KEY: name
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: saos10_acl_actions
  short_description: List of ACL actions.Manage the acl_actions acl_action configuration of a Ciena saos10 device
  description: "List of ACL actions.\n A list of ACL-actions, where each ACL-action specifies the action of the classified flow."
  author: Ciena
  options:
    config:
      description: A list of ACL-actions, where each ACL-action specifies the action of the classified flow.
      type: list
      elements: dict
      suboptions:
        name:
          description: 'A unique string that is either system assigned or assigned by the user but does not change over its life. (Key for list:
            acl-action)'
          type: str
          required: true
        description:
          description: A more detailed description that an operator can use to describe the action.
          type: str
          required: false
        action:
          description: Specifies an action for this acl action
          type: str
          required: false
          choices:
          - redirect
          - ingress-mirror
        custom:
          description: One or more custom destinations which act as destination for the acl-action (e.g. mirror/redirect)
          type: list
          elements: str
        flow_point:
          description: One or more flow-points which act as destination for the acl-action (e.g. mirror/redirect)
          type: list
          elements: str
        logical_port:
          description: One or more logical-ports which act as destination for the acl-action (e.g. mirror/redirect)
          type: list
          elements: str
      key: name
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
