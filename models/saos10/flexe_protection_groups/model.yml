GENERATOR_VERSION: '2.0'
NETWORK_OS: saos10
RESOURCE: flexe-protection-groups
XML_NAMESPACE: http://www.ciena.com/ns/yang/ciena-flexe
XML_ROOT_KEY: flexe-protection-groups
XML_ITEMS: flexe-protection-group
XML_ITEMS_KEY: name
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: saos10_flexe_protection_groups
  short_description: FlexE protection groups configurationsManage the flexe_protection_groups flexe_protection_group configuration of a Ciena
    saos10 device
  description: "FlexE protection groups configurations\n List of FlexE protection groups."
  author: Ciena
  options:
    config:
      description: List of FlexE protection groups.
      type: list
      elements: dict
      suboptions:
        name:
          description: 'Name for a FlexE protection group. (Key for list: flexe-protection-group)'
          type: str
          required: true
        protection_channel:
          description: Configuration of protection channel on this FlexE Protection group.
          type: str
          required: true
        protection_profile:
          description: Configuration of FlexE Protection Profile on this FlexE Protection group.
          type: str
          required: true
        working_channel:
          description: Configuration of working channel on this FlexE Protection group.
          type: str
          required: true
      key: name
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
