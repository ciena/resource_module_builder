GENERATOR_VERSION: '2.0'
NETWORK_OS: saos10
RESOURCE: access-flows
XML_NAMESPACE: urn:ciena:params:xml:ns:yang:ciena-pn::ciena-mef-access-flow
XML_ROOT_KEY: access-flows
XML_ITEMS: access-flow
XML_ITEMS_KEY: name
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: saos10_access_flows
  short_description: List of access-flow configuration entries. Each entry defines an ACL rule specific to an interface.Manage the access_flows
    access_flow configuration of a Ciena saos10 device
  description: "List of access-flow configuration entries. Each entry defines an ACL rule specific to an interface.\n List of access-flow configuration\
    \ entries. Each entry defines an ACL rule specific to an interface."
  author: Ciena
  options:
    config:
      description: List of access-flow configuration entries. Each entry defines an ACL rule specific to an interface.
      type: list
      elements: dict
      suboptions:
        name:
          description: 'A unique string that is either system assigned or assigned by the user but does not change over its life. (Key for list:
            access-flow)'
          type: str
          required: true
        description:
          description: A more detailed description that an operator can use to describe the flow.
          type: str
          required: false
        augment_action:
          description: A list of Actions that may augment the filter-action of the Access-Flow/ACL-Rule.
          type: list
          elements: str
        classifier_list:
          description: A reference to a list of classifier entries.
          type: list
          elements: str
        classifier_list_precedence:
          description: A precedence value for the access flow. Lower values take precedence over higher values
          type: int
          required: false
        filter_action:
          description: Specifies the filter-action for this Access-Flow/ACL-Rule
          type: str
          required: false
          choices:
          - deny
          - allow
        logging:
          description: Determines whether ACL logging will be enabled or not for an access-flow
          type: str
          required: false
          choices:
          - enable
          - disable
        none:
          description: When the Access-Flow is an ACL rule in an Access-Profile, use none. In this case, the access-profile is referenced by a
            parent-interface instead.
          type: list
          required: false
          elements: str
          choices:
          - 'null'
        parent_fp:
          description: This is used when the Access-Flow is an ACL rule that is not part of an Access-Profile. In this case, the parent-interface
            defines the flow-point that the Access-Flow applies to
          type: list
          elements: str
        parent_port:
          description: This is used when the Access-Flow is an ACL rule that is not part of an Access-Profile. In this case, the parent-interface
            defines the port that the Access-Flow applies to
          type: list
          elements: str
        stats_collection:
          description: Determines whether stats collection will be turned on or not for an access-flow
          type: str
          required: false
          choices:
          - 'on'
          - 'off'
      key: name
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
