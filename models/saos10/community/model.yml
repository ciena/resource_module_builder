GENERATOR_VERSION: '2.0'
NETWORK_OS: saos10
RESOURCE: snmp
XML_NAMESPACE: urn:ietf:params:xml:ns:yang:ietf-snmp
XML_ROOT_KEY: snmp
XML_ITEMS: community
XML_ITEMS_KEY: index
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: saos10_snmp
  short_description: Top-level container for SNMP-related configuration and status objects.Manage the snmp community configuration of a Ciena
    saos10 device
  description: "Top-level container for SNMP-related configuration and status objects.\n List of communities."
  author: Ciena
  options:
    config:
      description: List of communities.
      type: list
      elements: dict
      suboptions:
        index:
          description: 'Index into the community list. (Key for list: community)'
          type: str
          required: true
        security_name:
          description: The snmpCommunitySecurityName of this entry.
          type: str
          required: true
        binary_name:
          description: A community name represented as a binary value.
          type: str
          required: false
        context:
          description: The context in which management information is accessed when using the community string specified by this entry.
          type: str
          required: false
        engine_id:
          description: If not set, the value of the local SNMP engine is operationally used by the device.
          type: str
          required: false
        target_tag:
          description: Used to limit access for this community to the specified targets. Implementations MAY restrict the values of this leaf
            to be one of the available values of /snmp/target/tag in a valid configuration.
          type: str
          required: false
        text_name:
          description: A community name that can be represented as a YANG string.
          type: str
          required: false
      key: index
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
