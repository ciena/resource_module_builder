GENERATOR_VERSION: '2.0'
NETWORK_OS: saos10
RESOURCE: sat
XML_NAMESPACE: http://www.ciena.com/ns/yang/ciena-sat
XML_ROOT_KEY: sat
XML_ITEMS: bw-alloc-profile
XML_ITEMS_KEY: name
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: saos10_sat
  short_description: SAT configuration data.Manage the sat bw_alloc_profile configuration of a Ciena saos10 device
  description: "SAT configuration data.\n BW allocation profile entry"
  author: Ciena
  options:
    config:
      description: BW allocation profile entry
      type: list
      elements: dict
      suboptions:
        name:
          description: 'Name of the bandwidth allocation profile (Key for list: bw-alloc-profile)'
          type: str
          required: true
        pcp:
          description: Each PCP within the bw-alloc-profile has its own configuration.
          type: list
          elements: dict
          suboptions:
            pcp_value:
              description: 'PCP value associated with this entry. (Key for list: pcp)'
              type: int
              required: true
            ratio:
              description: Ratio of test bandwidth to allocate to the test session with this PCP value.
              type: int
              required: false
          key: pcp-value
      key: name
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
