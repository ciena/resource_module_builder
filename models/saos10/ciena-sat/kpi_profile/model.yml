GENERATOR_VERSION: '2.0'
NETWORK_OS: saos10
RESOURCE: sat
XML_NAMESPACE: http://www.ciena.com/ns/yang/ciena-sat
XML_ROOT_KEY: sat
XML_ITEMS: kpi-profile
XML_ITEMS_KEY: name
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: saos10_sat
  short_description: SAT configuration data.Manage the sat kpi_profile configuration of a Ciena saos10 device
  description: "SAT configuration data.\n Key performance indicator pass/fail criteria."
  author: Ciena
  options:
    config:
      description: Key performance indicator pass/fail criteria.
      type: list
      elements: dict
      suboptions:
        name:
          description: 'Name of the KPI profile (Key for list: kpi-profile)'
          type: str
          required: true
        pcp:
          description: Each PCP within the KPI profile has its own configuration.
          type: list
          elements: dict
          suboptions:
            pcp_value:
              description: 'PCP value associated with this entry (Key for list: pcp)'
              type: int
              required: true
            frameloss:
              description: Frameloss KPI for the given KPI profile, PCP and color expressed in percent of bandwidth * 10000 to provide a 4 decimal
                point value.
              type: int
              required: false
            latency:
              description: Maximum latency in milliseconds that the latency result should not exceed in order for the test to be considered a
                pass.
              type: int
              required: false
            max_num_outages:
              description: Maximum number of outages that can occur during the outage test in order for the test to be considered a pass.
              type: int
              required: false
            pdv:
              description: Maximum PDV in milliseconds that the PDV test result should not exceed in order for the test to be considered a pass.
              type: int
              required: false
            single_outage_max:
              description: Maximum time in milliseconds that any single outage should not exceed in order for the test to be considered a pass.
              type: int
              required: false
            sum_outages_max:
              description: Maximum time in milliseconds that the sum of recorded outages should not exceed in order for the test to be considered
                a pass.
              type: int
              required: false
            throughput:
              description: Throughput KPI for the given KPI profile, PCP and color expressed in percent of bandwidth * 10000 to provide a 4 decimal
                point value.
              type: int
              required: false
          key: pcp-value
        untagged:
          description: Untagged traffic does not have a PCP, so it is handled separately.
          type: dict
          suboptions:
            frameloss:
              description: Frameloss KPI for the given KPI profile, PCP and color expressed in percent of bandwidth * 10000 to provide a 4 decimal
                point value.
              type: int
              required: false
            latency:
              description: Maximum latency in milliseconds that the latency result should not exceed in order for the test to be considered a
                pass.
              type: int
              required: false
            max_num_outages:
              description: Maximum number of outages that can occur during the outage test in order for the test to be considered a pass.
              type: int
              required: false
            pdv:
              description: Maximum PDV in milliseconds that the PDV test result should not exceed in order for the test to be considered a pass.
              type: int
              required: false
            single_outage_max:
              description: Maximum time in milliseconds that any single outage should not exceed in order for the test to be considered a pass.
              type: int
              required: false
            sum_outages_max:
              description: Maximum time in milliseconds that the sum of recorded outages should not exceed in order for the test to be considered
                a pass.
              type: int
              required: false
            throughput:
              description: Throughput KPI for the given KPI profile, PCP and color expressed in percent of bandwidth * 10000 to provide a 4 decimal
                point value.
              type: int
              required: false
      key: name
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
