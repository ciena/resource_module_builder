GENERATOR_VERSION: '2.0'
NETWORK_OS: saos10
RESOURCE: sat
XML_NAMESPACE: http://www.ciena.com/ns/yang/ciena-sat
XML_ROOT_KEY: sat
XML_ITEMS: test-profile
XML_ITEMS_KEY: name
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: saos10_sat
  short_description: SAT configuration data.Manage the sat test_profile configuration of a Ciena saos10 device
  description: "SAT configuration data.\n Service activation test profile configuation information."
  author: Ciena
  options:
    config:
      description: Service activation test profile configuation information.
      type: list
      elements: dict
      suboptions:
        name:
          description: 'Name of the profile. (Key for list: test-profile)'
          type: str
          required: true
        bandwidth:
          description: Maximum bandwidth in Mbps to use when generating green test traffic for the profile.
          type: int
          required: false
        burst_test:
          description: Run packet burst test
          type: bool
          required: false
        bw_alloc_profile:
          description: Name of a valid Bandwidth Allocation profile, from the bw-alloc-profile list, used for distributing the profile bandwidth
            amongst the configured PCP values for this profile when running tests.
          type: str
          required: false
        c_color:
          description: Color of the C-VLAN tag for the test traffic. This is directly related to the value of the DEI bit configured in the VLAN
            tag of the test traffic. Green traffic will have its DEI bit set to 0 while Yellow traffic will have its DEI bit set to 1. Green test
            traffic is generated based on the bandwidth configured in the test profile. Yellow traffic is generated based on the excess-bandwidth
            parameter. Finally, if the user selects green-yellow-red, the yellow traffic is generated at 1.25 * excess-bandwidth. This is used
            only when encapType is set to dot1q. In a QinQ configuration, the c-dei bit is set to the same value as the s-dei bit in order to
            simplify software.
          type: str
          required: false
          choices:
          - green
          - yellow
          - green-yellow
          - green-yellow-red
        c_pcp:
          description: Bitmap of the C-VLAN PCP (Priority Code Point) value to test with. When RFC2544 test is enabled, only one PCP can be set
            in the mask. Otherwise, a test session will be run for each PCP bit set. Only used when the encapType is set to dot1q. In the QinQ
            type, the c-pcp of the test packet takes the same value as the s-pcp to simplify software.
          type: list
          required: false
          elements: str
          choices:
          - pcp0
          - pcp1
          - pcp2
          - pcp3
          - pcp4
          - pcp5
          - pcp6
          - pcp7
        c_vid:
          description: C-VLAN ID to used for generated packets when encapType is set to QinQ or dot1q.
          type: int
          required: false
        color_validation:
          description: Used to indicate whether the color bit of the test packet should be used to classifier the reflected packets or not. In
            color unaware testing, this should be set to false. Default is true.
          type: bool
          required: false
        custom_duration:
          description: Custom duration of testing in minutes. This leaf is only used when test-profile duration leaf is set to tCustom.
          type: int
          required: false
        custom_payload:
          description: Custom payload to be used in the generated packets.
          type: str
          required: false
        dscp:
          description: IP DSCP value to use for the generated packets.
          type: int
          required: false
        dst_addr:
          description: Specifies the unicast destination IP addr to use in IP test packet.
          type: str
          required: false
        dst_mac:
          description: MAC address to use as the destination MAC address on the generated packets.
          type: str
          required: false
        duration:
          description: Duration of the testing. The test group is repeated until the duration ends. When indefinite is set, test group is repeated
            until the user manually stops the test.
          type: str
          required: false
          choices:
          - t15min
          - t1hr
          - t6hr
          - t24hr
          - tIndefinite
          - tOnce
          - tCustom
        emix_sequence:
          description: Name of a valid EMIX sequence configured in the emix-sequence list, to use when y1564 is selected. The EMIX sequence is
            used instead of the frame size list if and only if y1564 is selected.
          type: str
          required: false
        encap_type:
          description: Encapsulation type to use for generated packets.
          type: str
          required: false
          choices:
          - untagged
          - dot1Q
          - qinq
        excess_bandwidth:
          description: Maximum bandwidth in Mbps to use when generating yellow test traffic for the profile. When testing for red color, this
            bandwidth is multiplied by 1.25
          type: int
          required: false
        frame_size:
          description: Used to replace the existing frame size table with the specified list. List of frame sizes the test will run with. The
            selected tests are performed for one frames size, then the same test is repeated with the next frame size in the list. Results are
            provided for each separate frame size from the list. When rfc2544 is selected, the default frame size is made up of the following
            7 frame sizes; 64,128,256,512,1024,1280,1518; The first frame size may differ from 64 depending on the VLAN encapsulation type configured
            and/or the IP version used for the test; Untagged, non IP or IPv4 64 Untagged IPv6 84 dot1q non IP or IPv4 64 dot1q IPv6 84 QinQ non
            IP or IPv4 68 QinQ IPv6 88.
          type: list
          elements: int
        frameloss_decrement:
          description: For the frame loss test, this indicates the value by which the frameloss-start-bw is decremented by, when a frameloss is
            recorded in an iteration of the frameloss test until no frameloss is detected
          type: int
          required: false
        frameloss_decrement_type:
          description: For the frame loss test, this field defines whether to decrement the frameloss test bandwidth by percent (fixed at 10%)
            or by the user specified value given in the frameloss-decrement field
          type: str
          required: false
          choices:
          - percent
          - Mbps
        frameloss_start_bw:
          description: For the frame loss test, this indicates which bandwidth value to use as the starting bandwidth; the maximum bandwidth determined
            via the throughput test or the bandwidth parameter configured in the profile. Note that when rfc2544 is enabled, this value is ignored
            and the maximum bandwidth of the link is used (minimum of the port under test speed and entity/FPGA link speed).
          type: str
          required: false
          choices:
          - profile-bandwidth
          - maximum-throughput
        frameloss_test:
          description: Run frame loss test
          type: bool
          required: false
        frmloss_bw_calculation_mode:
          description: Mode to calculate rate in test-instance statistic output for frameloss results.
          type: str
          required: false
          choices:
          - payload
          - transport
        inner_vid_validation:
          description: Used to indicate whether the inner VLAN is used to classify reflected traffic. This is only valid when the encapsulation
            is set to QinQ. Default is true
          type: bool
          required: false
        interval:
          description: Interval between the start of one test group to the start of the next test group.
          type: str
          required: false
          choices:
          - t15min
          - t1hr
          - t6hr
          - tCompletion
          - t2hr
        kpi_profile_name:
          description: Name of a valid KPI profile, from the kpi-profile list, to use when analysing the test results for this profile.
          type: str
          required: false
        latency_test:
          description: Run latency test
          type: bool
          required: false
        max_samples:
          description: For the latency and PDV tests, this is the number of samples to take in order to determine the min, avg and max latency
            and avg PDV.
          type: int
          required: false
        max_searches:
          description: The throughput test uses a binary search to find the maximum rate at which test traffic can be sent without any packet
            drops. This attributes dictates the maximum number of searches to perform in the binary search algorithm, before stopping the test.
          type: int
          required: false
        measurement_direction:
          description: This indicates the the type of measurement taken for latency and PDV tests.
          type: str
          required: false
          choices:
          - one-way-forward
          - one-way-backward
          - one-way-forward-and-backward
          - two-way
        outage_test:
          description: Run outage test
          type: bool
          required: false
        pcp_validation:
          description: Used to indicate whether the PCP value of the test packet should be used to classifier the reflected packets or not. When
            color remarking is used, this should be set to false. Default is true.
          type: bool
          required: false
        pdu_type:
          description: Test PDU type.
          type: str
          required: false
          choices:
          - ethernet
          - ip
          - udp-echo
        pdv_test:
          description: Run packet delay variation test
          type: bool
          required: false
        rfc2544_suite:
          description: Run RFC2544 test suite which includes throughput, frame loss and latency tests
          type: bool
          required: false
        s_color:
          description: Color of the S-VLAN tag for the test traffic. This is directly related to the value of the DEI bit configured in the VLAN
            tag of the test traffic. Green traffic will have its DEI bit set to 0 while Yellow traffic will have its DEI bit set to 1. Green test
            traffic is generated based on the bandwidth configured in the test profile. Yellow traffic is generated based on the excess-bandwidth
            parameter. Finally, if the user selects green-yellow-red, the yellow traffic is generated at 1.25 * excess-bandwidth. This is used
            only when encapType is set to QinQ
          type: str
          required: false
          choices:
          - green
          - yellow
          - green-yellow
          - green-yellow-red
        s_pcp:
          description: Bitmap of the S-VLAN PCP (Priority Code Point) value to test with. When RFC2544 test is enabled, only one PCP can be set
            in the mask. Otherwise, a test session will be run for each PCP bit set. Used when the encapType set to QinQ
          type: list
          required: false
          elements: str
          choices:
          - pcp0
          - pcp1
          - pcp2
          - pcp3
          - pcp4
          - pcp5
          - pcp6
          - pcp7
        s_vid:
          description: S-VLAN ID to used for generated packets when encapType is set to QinQ
          type: int
          required: false
        sampling_interval:
          description: This is the number of 100ms steps to use when running any of the configured tests. A value of 1 represents 100ms, a value
            of 600 makes a sampling interval of 1 minutes (600 * 100ms). For the throughput and frame loss tests, this is the number of milliseconds
            to generate test traffic for before stopping and checking for frame drops. For latency and PDV, it represents the number of milliseconds
            between samples.
          type: int
          required: false
        source_mac_validation:
          description: Used to indicate whether the source MAC address of the reflected frames is used to classify the test frame against the
            correct test instance/session.Default is true.
          type: bool
          required: false
        src_addr:
          description: Specifies the unicast source IP address to use in IP test packet.
          type: str
          required: false
        throughput_test:
          description: Run throughput test
          type: bool
          required: false
        tpid:
          description: Vlan tag protocol identifier to use for the generated packets.
          type: str
          required: false
          choices:
          - '0x8100'
          - '0x88a8'
          - '0x9100'
        tput_bw_calculation_mode:
          description: Mode to calculate throughput results in test-instance statistic output.
          type: str
          required: false
          choices:
          - payload
          - transport
        vid_validation:
          description: Indicates whether the VID of the reflected test frame should be checked for a match when it arrives back at the generator.
            If VID validation is set to false, PCP and Color validation are ignored and automatically become false.
          type: bool
          required: false
        y1564_suite:
          description: The Y1564 test includes the throughput, frameloss, latency and PDV tests and requires an EMIX sequence to be configured.
            If the profile's EMIX sequencei s not configured, the default generator EMIX sequence is used. Y1564 and RFC2544 are mutually exclusive.
          type: bool
          required: false
      key: name
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
