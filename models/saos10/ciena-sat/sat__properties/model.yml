GENERATOR_VERSION: '2.0'
NETWORK_OS: saos10
RESOURCE: sat
XML_NAMESPACE: http://www.ciena.com/ns/yang/ciena-sat
XML_ROOT_KEY: sat
XML_ITEMS: null
XML_ITEMS_KEY: null
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: saos10_sat__properties
  short_description: SAT configuration data.Manage the sat configuration of a Ciena saos10 device
  description: SAT configuration data.
  author: Ciena
  options:
    config:
      description: SAT configuration data.
      type: dict
      suboptions:
        sat_global:
          description: SAT global configuration data.
          type: dict
          suboptions:
            admin_state:
              description: Overall administrative state of the benchmark feature.
              type: str
              required: false
              choices:
              - disabled
              - enabled
            default_emix_sequence:
              description: Default EMIX sequence to be used on a test instance when no EMIX is specified in the test instance targeted test profile.
                This applies to generator test instances only.
              type: str
              required: false
            generator_default_bw_alloc_profile:
              description: Default bandwidth allocation profile to be used with a test instance when no bandwidth allocation profile is specified
                in the targeted test profile. This applies to generator test instances only.
              type: str
              required: false
            generator_default_kpi_profile:
              description: Default KPI profile to be used to analyze the results of a test instance when no KPI profile is specifed in the targeted
                test profile. This applies to generator test instances only.
              type: str
              required: false
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
