GENERATOR_VERSION: '2.0'
NETWORK_OS: saos10
RESOURCE: sat
XML_NAMESPACE: http://www.ciena.com/ns/yang/ciena-sat
XML_ROOT_KEY: sat
XML_ITEMS: test-instance
XML_ITEMS_KEY: name
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: saos10_sat
  short_description: SAT configuration data.Manage the sat test_instance configuration of a Ciena saos10 device
  description: "SAT configuration data.\n Service activation test instance configuration data."
  author: Ciena
  options:
    config:
      description: Service activation test instance configuration data.
      type: list
      elements: dict
      suboptions:
        name:
          description: 'Unique name given to the test instance. (Key for list: test-instance)'
          type: str
          required: true
        admin_state:
          description: Indicates the administrative state of the test instance. Upon enabling a test instance, resources are allocated in hardware.
            For reflector test instances, this triggers the start of reflection of any test traffic received that matches the specified vid combination
            on the specified port/sub-port.
          type: str
          required: false
          choices:
          - disabled
          - enabled
        c_vid:
          description: C VLAN ID to use for testing. For generator test instances, this over-writes the value defined in the referenced test profile
            if applicable (encap-type set to dot1q or qinq). For reflector test instances, this has to be set to a valid c-vid accepted by the
            associated port/sub-port. A value of 0xFFFF indicates ANY c-vid.
          type: int
          required: false
        dst_mac:
          description: Destination MAC address to use for generator test instances. When set, this over writes the value specified in the referenced
            test profile. This field is not applicable for reflector test instances.
          type: str
          required: false
        flow_point_id:
          description: flow-point or sub-port to base this test instance on. The flow-point has to be a child of the logical port under test associated
            with an existing entity.
          type: str
          required: false
        profile:
          description: Name of an existing test profile to be used with the test instance as the template for testing. A test profile ID has to
            be specified if this test instance is associated with a generator entity. If it's a reflector test instance, a profile ID CANNOT be
            specified, it has to remain unset.
          type: str
          required: false
        s_vid:
          description: S VLAN ID to use for testing. For generator test instances, this over-writes the value defined in the referenced test profile
            if applicable (encap-type set to qinq). For reflector test instances, this has to be set to a valid s-vid accepted by the associated
            sub-port. A value of 0xFFFF indicates ANY s-vid.
          type: int
          required: false
        untagged:
          description: When set to true, this indicates that the test instance is to be associated with untagged data traffic. When this is set,
            the cvid and svid parameters must be 0.
          type: bool
          required: false
      key: name
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
