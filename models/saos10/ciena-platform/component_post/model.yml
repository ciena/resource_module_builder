GENERATOR_VERSION: '2.0'
NETWORK_OS: saos10
RESOURCE: component-post
XML_NAMESPACE: http://www.ciena.com/ns/yang/ciena-platform
XML_ROOT_KEY: component-post
XML_ITEMS: null
XML_ITEMS_KEY: null
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: saos10_component_post
  short_description: POST related system variablesManage the component_post configuration of a Ciena saos10 device
  description: POST related system variables
  author: Ciena
  options:
    config:
      description: POST related system variables
      type: dict
      suboptions:
        components:
          description: Enclosing container for all components
          type: dict
          suboptions:
            component:
              description: List of POST components
              type: list
              elements: dict
              suboptions:
                name:
                  description: 'Name of the POST component (Key for list: component)'
                  type: str
                  required: true
                  choices:
                  - macsec
                enforce_now:
                  description: Enforcing action immediately with the current test status
                  type: list
                  required: false
                  elements: str
                  choices:
                  - 'null'
                failure_action:
                  description: Action to be taken when the test fails
                  type: str
                  required: false
                  choices:
                  - none
                  - system-reboot
              key: name
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
