  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: saos10_maintenance_domain__properties
  short_description: A Maintenance Domain managed object is required in order to create an MA with a MAID that includes that Maintenance Domain's
    Name. From this Maintenance Domain managed object, all Maintenance Association managed objects associated with that Maintenance Domain managed
    object can be accessed, and thus controlled.Manage the maintenance_domain__properties properties configuration of a Ciena saos10 device
  description: A Maintenance Domain managed object is required in order to create an MA with a MAID that includes that Maintenance Domain's Name.
    From this Maintenance Domain managed object, all Maintenance Association managed objects associated with that Maintenance Domain managed object
    can be accessed, and thus controlled.
  author: Ciena
  options:
    config:
      id:
        description: 'A unique identifier of a Maintenance Domain (Key for list: maintenance-domain)'
        type: str
        required: true
      id_permission:
        description: This parameter indicates what, if anything, is to be included in the Sender ID TLV. Since, in this variable, there is no
          encompassing Maintenance Domain, the value 'defer' is not allowed
        type: str
        required: true
        choices:
        - none
        - chassis
        - manage
        - chassis-manage
        - defer
      mhf_creation:
        description: A value indicating if the Management entity can create MHFs (MIP Half Function) for this VID at this MD Level. The value
          'defer' means that MHF creation for the VLAN is controlled by the corresponding 'mhf-creation' leaf in the 'default-md-level' list entry.
        type: str
        required: true
        choices:
        - none
        - default
        - explicit
        - defer
      md_level:
        description: Integer identifying the Maintenance Domain Level (MD Level). Higher numbers correspond to higher Maintenance Domains, those
          with the greatest physical reach, with the highest values for customers' CFM PDUs. Lower numbers correspond to lower Maintenance Domains,
          those with more limited physical reach, with the lowest values for CFM PDUs protecting single bridges or physical links.
        type: int
        required: false
      name:
        description: The value union for the Maintenance Domain Name. The type must correspond to the configuration name-type according to the
          following; - If the name-type is 'domain-name ' then the name must be of type inet;host - If the name-type is 'mac-address-and-uint'
          then the name must be of type mac-address-and-uint-type - If the name-type is 'character-string' then the name must be of type string
          - If the name-type is 'none' then the name must not be defined
        type: str
        required: false
      name_type:
        description: Type discriminator for the value union described in the 'name' leaf.
        type: str
        required: false
        choices:
        - none
        - domain-name
        - mac-address-and-uint
        - character-string
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
