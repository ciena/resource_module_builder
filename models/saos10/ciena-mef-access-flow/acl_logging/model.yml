XML_ROOT_KEY: acl-logging
XML_ITEMS: null
XML_ITEMS_KEY: null
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: saos10_acl_logging
  short_description: 'Configures ACL logging global parameters '
  description: 'Configures ACL logging global parameters '
  author: Ciena
  options:
    config:
      description: 'Configures ACL logging global parameters '
      type: dict
      suboptions:
        acl_logging_timer:
          description: Logging interval in seconds after which packets hitting ACL will be logged.
          type: int
          required: false
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
