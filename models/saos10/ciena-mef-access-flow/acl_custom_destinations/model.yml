GENERATOR_VERSION: '2.0'
NETWORK_OS: saos10
RESOURCE: acl-custom-destinations
XML_NAMESPACE: urn:ciena:params:xml:ns:yang:ciena-pn::ciena-mef-access-flow
XML_ROOT_KEY: acl-custom-destinations
XML_ITEMS: acl-custom-destination
XML_ITEMS_KEY: name
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: saos10_acl_custom_destinations
  short_description: List of custom destinations. A given ACL rule may be redirecting/mirroring to one or more destinations.Manage the acl_custom_destinations
    acl_custom_destination configuration of a Ciena saos10 device
  description: "List of custom destinations. A given ACL rule may be redirecting/mirroring to one or more destinations.\n A list of ACL-customized-destinations\
    \ that the classified flows may be directed to."
  author: Ciena
  options:
    config:
      description: A list of ACL-customized-destinations that the classified flows may be directed to.
      type: list
      elements: dict
      key: name
      suboptions:
        name:
          description: 'A unique string that is either system assigned or assigned by the user but does not change over its life. (Key for list:
            acl-custom-destination)'
          type: str
          required: true
        description:
          description: A more detailed description that an operator can use to describe the custom destination.
          type: str
          required: false
        destination:
          description: Specifies an application name for this acl destination
          type: str
          required: false
          choices:
          - voltha-agent
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
