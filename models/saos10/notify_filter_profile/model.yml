GENERATOR_VERSION: '2.0'
NETWORK_OS: saos10
RESOURCE: snmp
XML_NAMESPACE: urn:ietf:params:xml:ns:yang:ietf-snmp
XML_ROOT_KEY: snmp
XML_ITEMS: notify-filter-profile
XML_ITEMS_KEY: name
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: saos10_snmp
  short_description: Top-level container for SNMP-related configuration and status objects.Manage the snmp notify_filter_profile configuration
    of a Ciena saos10 device
  description: "Top-level container for SNMP-related configuration and status objects.\n Notification filter profiles. The leaf /snmp/target/notify-filter-profile\
    \ is used to associate a filter profile with a target. If an entry in this list is referred to by one or more /snmp/target/notify-filter-profile\
    \ items, each such notify-filter-profile is represented by one snmpNotifyFilterProfileEntry. If an entry in this list is not referred to by\
    \ any /snmp/target/notify-filter-profile, the entry is not mapped to snmpNotifyFilterProfileTable."
  author: Ciena
  options:
    config:
      description: Notification filter profiles. The leaf /snmp/target/notify-filter-profile is used to associate a filter profile with a target.
        If an entry in this list is referred to by one or more /snmp/target/notify-filter-profile items, each such notify-filter-profile is represented
        by one snmpNotifyFilterProfileEntry. If an entry in this list is not referred to by any /snmp/target/notify-filter-profile, the entry
        is not mapped to snmpNotifyFilterProfileTable.
      type: list
      elements: dict
      suboptions:
        name:
          description: 'Name of the filter profile. (Key for list: notify-filter-profile)'
          type: str
          required: true
        exclude:
          description: A family of subtrees excluded from this filter.
          type: list
          elements: str
        include:
          description: A family of subtrees included in this filter.
          type: list
          elements: str
      key: name
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
