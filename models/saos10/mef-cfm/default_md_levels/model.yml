GENERATOR_VERSION: '2.0'
NETWORK_OS: saos10
RESOURCE: default-md-levels
XML_NAMESPACE: http://metroethernetforum.org/ns/yang/mef-cfm
XML_ROOT_KEY: default-md-levels
XML_ITEMS: default-md-level
XML_ITEMS_KEY: primary-vid component-id
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: saos10_default_md_levels
  short_description: Data definitions related to the global default MD level and the default MD levels associated with specific VIDsManage the
    default_md_levels default_md_level configuration of a Ciena saos10 device
  description: "Data definitions related to the global default MD level and the default MD levels associated with specific VIDs\n Data definitions\
    \ related to the default MD level associated with specific VIDs"
  author: Ciena
  options:
    config:
      description: Data definitions related to the default MD level associated with specific VIDs
      type: list
      elements: dict
      suboptions:
        component_id:
          description: 'The bridge component within the system to which the information in this default-md-level applies (Key for list: default-md-level)'
          type: int
          required: true
        primary_vid:
          description: 'The primary VID on the MD (Key for list: default-md-level)'
          type: int
          required: true
        default_id_permission:
          description: This parameter indicates what, if anything, is to be included in the Sender ID TLV transmitted by MPs configured in a default
            MD Level
          type: str
          required: false
          choices:
          - none
          - chassis
          - manage
          - chassis-manage
          - defer
        md_level:
          description: The MD Level at which MHFs are to be created and Sender ID TLV transmission by those MHFs is to be controlled, for the
            VLAN to which this entry's definitions apply. If this leaf has the value -1, the MD Level for MHF creation for this VLAN is controlled
            by the content of the default-md-levels container. -1 is not a valid value for this parameter when used in the default-md-levels.
          type: int
          required: false
        mhf_creation:
          description: This parameter indicates whether the management entity can create MHFs for this VID(s). The value 'defer' has different
            meanings depending on where the grouping is used; - The value 'defer' is not allowed when this grouping is used in the 'default-md-levels'
            container - When used in a member of the 'default-md-level' list the value 'defer' means that MHF creation for the VLAN is controlled
            by the corresponding 'mhf-creation' leaf in the 'default-md-levels' container.
          type: str
          required: false
          choices:
          - none
          - default
          - explicit
          - defer
        status:
          description: State of this list entry. The value 'true' if there is no entry in the maintenance-assoication list entry defining an MA
            for the same VLAN ID and MD Level as this table's entry, and on which MA an Up MEP is defined, else 'false'.
          type: bool
          required: false
        vid:
          description: A list of VIDs associated with the MHF
          type: list
          elements: int
      key: primary-vid component-id
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
