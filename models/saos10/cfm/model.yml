DOCUMENTATION:
  module: saos10_cfm
  short_description: null
  description: null
  author: Ciena
  options:
    config:
      default_md_levels:
        description: Data definitions related to the global default MD level and the default MD levels associated with specific VIDs
        type: dict
        suboptions:
          default_id_permission:
            description: This parameter indicates what, if anything, is to be included in the Sender ID TLV transmitted by MPs configured in a
              default MD Level
            type: str
            required: false
            choices:
            - none
            - chassis
            - manage
            - chassis-manage
            - defer
          default_md_level:
            description: Data definitions related to the default MD level associated with specific VIDs
            type: list
            elements: dict
            suboptions:
              component_id:
                description: 'The bridge component within the system to which the information in this default-md-level applies (Key for list:
                  default-md-level)'
                type: int
                required: true
              primary_vid:
                description: 'The primary VID on the MD (Key for list: default-md-level)'
                type: int
                required: true
              default_id_permission:
                description: This parameter indicates what, if anything, is to be included in the Sender ID TLV transmitted by MPs configured
                  in a default MD Level
                type: str
                required: false
                choices:
                - none
                - chassis
                - manage
                - chassis-manage
                - defer
              md_level:
                description: The MD Level at which MHFs are to be created and Sender ID TLV transmission by those MHFs is to be controlled, for
                  the VLAN to which this entry's definitions apply. If this leaf has the value -1, the MD Level for MHF creation for this VLAN
                  is controlled by the content of the default-md-levels container. -1 is not a valid value for this parameter when used in the
                  default-md-levels.
                type: int
                required: false
              mhf_creation:
                description: This parameter indicates whether the management entity can create MHFs for this VID(s). The value 'defer' has different
                  meanings depending on where the grouping is used; - The value 'defer' is not allowed when this grouping is used in the 'default-md-levels'
                  container - When used in a member of the 'default-md-level' list the value 'defer' means that MHF creation for the VLAN is controlled
                  by the corresponding 'mhf-creation' leaf in the 'default-md-levels' container.
                type: str
                required: false
                choices:
                - none
                - default
                - explicit
                - defer
              status:
                description: State of this list entry. The value 'true' if there is no entry in the maintenance-assoication list entry defining
                  an MA for the same VLAN ID and MD Level as this table's entry, and on which MA an Up MEP is defined, else 'false'.
                type: bool
                required: false
              vid:
                description: A list of VIDs associated with the MHF
                type: list
                elements: int
            key: primary-vid component-id
          md_level:
            description: The MD Level at which MHFs are to be created and Sender ID TLV transmission by those MHFs is to be controlled, for the
              VLAN to which this entry's definitions apply. If this leaf has the value -1, the MD Level for MHF creation for this VLAN is controlled
              by the content of the default-md-levels container. -1 is not a valid value for this parameter when used in the default-md-levels.
            type: int
            required: false
          mhf_creation:
            description: This parameter indicates whether the management entity can create MHFs for this VID(s). The value 'defer' has different
              meanings depending on where the grouping is used; - The value 'defer' is not allowed when this grouping is used in the 'default-md-levels'
              container - When used in a member of the 'default-md-level' list the value 'defer' means that MHF creation for the VLAN is controlled
              by the corresponding 'mhf-creation' leaf in the 'default-md-levels' container.
            type: str
            required: false
            choices:
            - none
            - default
            - explicit
            - defer
      maintenance_domain:
        description: A Maintenance Domain managed object is required in order to create an MA with a MAID that includes that Maintenance Domain's
          Name. From this Maintenance Domain managed object, all Maintenance Association managed objects associated with that Maintenance Domain
          managed object can be accessed, and thus controlled.
        type: list
        elements: dict
        suboptions:
          id:
            description: 'A unique identifier of a Maintenance Domain (Key for list: maintenance-domain)'
            type: str
            required: true
          id_permission:
            description: This parameter indicates what, if anything, is to be included in the Sender ID TLV. Since, in this variable, there is
              no encompassing Maintenance Domain, the value 'defer' is not allowed
            type: str
            required: true
            choices:
            - none
            - chassis
            - manage
            - chassis-manage
            - defer
          mhf_creation:
            description: A value indicating if the Management entity can create MHFs (MIP Half Function) for this VID at this MD Level. The value
              'defer' means that MHF creation for the VLAN is controlled by the corresponding 'mhf-creation' leaf in the 'default-md-level' list
              entry.
            type: str
            required: true
            choices:
            - none
            - default
            - explicit
            - defer
          maintenance_association:
            description: This list represents Maintenance Entity Groups (Y.1731) or Maintenance Associations (802.1ag). MEGs/MAs are sets of MEPs,
              each configured to the same service inside a common OAM domain.
            type: list
            elements: dict
            suboptions:
              ccm_interval:
                description: The interval between CCM transmissions to be used by all MEPs in the MA
                type: str
                required: true
                choices:
                - invalid
                - 3.3ms
                - 10ms
                - 100ms
                - 1s
                - 10s
                - 1min
                - 10min
              id:
                description: 'A unique identifier of a Maintenance Association (Key for list: maintenance-association)'
                type: str
                required: true
              component_list:
                description: A list of components each of which can be managed in a manner essentially equivalent to an 802.1Q bridge.
                type: list
                elements: dict
                suboptions:
                  component_id:
                    description: 'The bridge component within the system to which the information in this maintenance-association applies (Key
                      for list: component-list)'
                    type: int
                    required: true
                  id_permission:
                    description: This parameter indicates what, if anything, is to be included in the Sender ID TLV transmitted by MPs configured
                      in this MA. A value of 'defer' means that the contents of the Sender ID TLV are determined by the enclosing maintenance-domain
                      instance,
                    type: str
                    required: false
                    choices:
                    - none
                    - chassis
                    - manage
                    - chassis-manage
                    - defer
                  mhf_creation:
                    description: An enumerated value indicating whether the management entity can create MHFs for this MA. A value of 'defer'
                      here means that control of MHF creation is deferred to the corresponding variable in the enclosing maintenance-domain.
                    type: str
                    required: false
                    choices:
                    - none
                    - default
                    - explicit
                    - defer
                  vid:
                    description: The VID(s) monitored by this MA, or 0, if the MA is not attached to any VID. The first VID returned is the MA's
                      Primary VID
                    type: list
                    elements: int
                key: component-id
              maintenance_association_end_point:
                description: The list of Maintenance association End Points in a specific Maintance Association.
                type: list
                elements: dict
                suboptions:
                  administrative_state:
                    description: The administrative state of the MEP
                    type: bool
                    required: true
                  ccm_ltm_priority:
                    description: The priority parameter for CCMs and LTMs transmitted by the MEP.
                    type: int
                    required: true
                  direction:
                    description: A value indicating the direction in which the MEP faces on the interface.
                    type: str
                    required: true
                    choices:
                    - up
                    - down
                  interface:
                    description: An interface, either a Bridge Port or an aggregated IEEE 802.3 port within a Bridge Port, to which the MEP is
                      attached. Each interface in the system is uniquely identified by an interface-name. The structure and content of the name
                      is outside the scope of this specification.
                    type: str
                    required: true
                  mep_identifier:
                    description: 'Integer that is unique among all the MEPs in the same MA. Other definition is; a small integer, unique over
                      a given Maintenance Association, identifying a specific Maintenance association End Point. (Key for list: maintenance-association-end-point)'
                    type: int
                    required: true
                  primary_vid:
                    description: The Primary VID of the MEP. The value 0 indicates that either the Primary VID is that of the MEP's MA or that
                      the MEP's MA is associated with no VID
                    type: int
                    required: true
                  continuity_check:
                    description: Data definitions related to the Continuity Check function.
                    type: dict
                    suboptions:
                      cci_enabled:
                        description: An indicator of whether the MEP is or is not to generate CCMs
                        type: bool
                        required: false
                      fng_alarm_time:
                        description: The time that defects must be present before a Fault Alarm is issued
                        type: int
                        required: false
                      fng_reset_time:
                        description: The time that defects must be absent before resetting a Fault Alarm
                        type: int
                        required: false
                      lowest_fault_priority_defect:
                        description: The lowest priority defect that is allowed to generate a Fault Alarm. The non-existence of this leaf means
                          that no defects are to be reported
                        type: str
                        required: false
                        choices:
                        - remote-rdi
                        - remote-mac-error
                        - remote-invalid-ccm
                        - invalid-ccm
                        - cross-connect-ccm
                key: mep-identifier
              name:
                description: The value union for the Maintenance Association Name. The type must correspond to the configuration name-type according
                  to the following; - If the name-type is 'primary-vid' then the name must be of type vlan-id-type - If the name-type is 'character-string'
                  then the name must be of type string - If the name-type is 'uint16' then the name must be of type uint16 - If the name-type
                  is 'rfc2685-vpn-id' then the name must be of type binary
                type: str
                required: false
              name_type:
                description: Name type discriminator for the 'name' leaf.
                type: str
                required: false
                choices:
                - primary-vid
                - character-string
                - uint16
                - rfc2685-vpn-id
              remote_meps:
                description: A list of the MEPIDs of the MEPs in the MA.
                type: list
                elements: int
            key: id
          md_level:
            description: Integer identifying the Maintenance Domain Level (MD Level). Higher numbers correspond to higher Maintenance Domains,
              those with the greatest physical reach, with the highest values for customers' CFM PDUs. Lower numbers correspond to lower Maintenance
              Domains, those with more limited physical reach, with the lowest values for CFM PDUs protecting single bridges or physical links.
            type: int
            required: false
          name:
            description: The value union for the Maintenance Domain Name. The type must correspond to the configuration name-type according to
              the following; - If the name-type is 'domain-name ' then the name must be of type inet;host - If the name-type is 'mac-address-and-uint'
              then the name must be of type mac-address-and-uint-type - If the name-type is 'character-string' then the name must be of type string
              - If the name-type is 'none' then the name must not be defined
            type: str
            required: false
          name_type:
            description: Type discriminator for the value union described in the 'name' leaf.
            type: str
            required: false
            choices:
            - none
            - domain-name
            - mac-address-and-uint
            - character-string
        key: id
    state:
      description: The state of the configuration after module completion.
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
