GENERATOR_VERSION: '2.0'
NETWORK_OS: saos10
RESOURCE: flexe-cross-connects
XML_NAMESPACE: http://www.ciena.com/ns/yang/ciena-flexe
XML_ROOT_KEY: flexe-cross-connects
XML_ITEMS: flexe-cross-connect
XML_ITEMS_KEY: name
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: saos10_flexe_cross_connects
  short_description: FlexE cross connect configurationsManage the flexe_cross_connects flexe_cross_connect configuration of a Ciena saos10 device
  description: "FlexE cross connect configurations\n List of FlexE cross-connects. FlexE cross-connect can be between Faceplate standard ethernet\
    \ ETTP and FlexE MAC ETTP or two FlexE channels"
  author: Ciena
  options:
    config:
      description: List of FlexE cross-connects. FlexE cross-connect can be between Faceplate standard ethernet ETTP and FlexE MAC ETTP or two
        FlexE channels
      type: list
      elements: dict
      suboptions:
        name:
          description: 'Name for FlexE cross-connect. (Key for list: flexe-cross-connect)'
          type: str
          required: true
        ettp_end_point_a:
          description: ETTP endpoint.
          type: str
          required: false
        ettp_end_point_b:
          description: ETTP endpoint.
          type: str
          required: false
        flexe_channel_end_point_a:
          description: FlexE channel endpoint.
          type: str
          required: false
        flexe_channel_end_point_b:
          description: FlexE channel endpoint.
          type: str
          required: false
        protection_group_end_point_a:
          description: FlexE protection group endpoint.
          type: str
          required: false
        protection_group_end_point_b:
          description: FlexE protection group endpoint.
          type: str
          required: false
      key: name
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
