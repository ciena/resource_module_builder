GENERATOR_VERSION: '2.0'
NETWORK_OS: saos10
RESOURCE: sat
XML_NAMESPACE: http://www.ciena.com/ns/yang/ciena-sat
XML_ROOT_KEY: sat
XML_ITEMS: null
XML_ITEMS_KEY: null
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: saos10_sat__properties
  short_description: SAT configuration data.Manage the sat__properties properties configuration of a Ciena saos10 device
  description: SAT configuration data.
  author: Ciena
  options:
    config:
      description: SAT configuration data.
      type: dict
      suboptions:
        bw_alloc_profile:
          description: BW allocation profile entry
          type: list
          elements: dict
          suboptions:
            name:
              description: 'Name of the bandwidth allocation profile (Key for list: bw-alloc-profile)'
              type: str
              required: true
            pcp:
              description: Each PCP within the bw-alloc-profile has its own configuration.
              type: list
              elements: dict
              suboptions:
                pcp_value:
                  description: 'PCP value associated with this entry. (Key for list: pcp)'
                  type: int
                  required: true
                ratio:
                  description: Ratio of test bandwidth to allocate to the test session with this PCP value.
                  type: int
                  required: false
              key: pcp-value
          key: name
        emix_sequence:
          description: EMIX sequence entry.
          type: list
          elements: dict
          suboptions:
            name:
              description: 'Name of this EMIX sequence (Key for list: emix-sequence)'
              type: str
              required: true
            sequence:
              description: EMIX sequence which is a sequence of up to 16 letters from the following set, that can be repeated, where each letter
                is associated with the frame size below it; a b c d e f g h u v w x 64 128 256 512 1024 1280 1518 MTU custom 84 68 88 The u frame
                size is user configurable via the emix-sequence-UFrameSize attribute while the h frame size is the maximum frame size configured
                at the entity level. If the h frame size is not configured at the entity level, h takes the value of the maximum frame size of
                the port under test. Letter v is the minimum frame size for IPv6 untagged or dot1q test frames, w is the minimum for IPv4 qinq
                test frames, and x is the minimum for IPv6 qinq test frames. The EMIX character set is available via the emix-sequence-character-set
                list.
              type: str
              required: false
            u_frame_size:
              description: The frame size associated with the u letter in the given sequence. The default value is 594.
              type: int
              required: false
          key: name
        entity:
          description: Service activation testing entity configuration.
          type: list
          elements: dict
          suboptions:
            name:
              description: 'Name of the service activation test entity. (Key for list: entity)'
              type: str
              required: true
            admin_state:
              description: SAT entity's administrative state.
              type: str
              required: false
              choices:
              - disabled
              - enabled
            assoc_gen_vendor_type:
              description: This is an indicator as to what is the vendor of the associated generator entity connected to this reflector SAT entity.
                This field is only valid for a reflector SAT entity.
              type: str
              required: false
              choices:
              - other
              - ciena
            generator_h_frame_size:
              description: Maximum frame size that should be generated by the generator device. This H frame size should be set to leave enough
                room for extra encapsulation bytes that will be pushed onto the packet by the switch when pushing this test packet out on the
                network side port. A value of 0 indicates that the maximum frame size for the entity port should be used. The generator device
                will ensure that any frame size list or EMIX used during the test is adjusted accordingly. This field is only valid for a generator
                SAT entity.
              type: int
              required: false
            local_mac:
              description: Used to manually configure the reflector mac address
              type: str
              required: false
            mode:
              description: SAT entity's mode of operation
              type: str
              required: false
              choices:
              - in-service
              - out-of-service
              - vid-out-of-service
              - evc-out-of-service
            port:
              description: SAT entity's port under test
              type: str
              required: false
            reflection_level:
              description: For reflector entities, this indicates the minimum reflection level required. If test traffic is going over an ethernet
                L2 cloud, l2-only is fine. But if the test traffic is going over an IP network, the reflector needs to be able to swap L2 and
                L3 fields. Depending on the type of IP network, the user needs to configure IPv4 or IPv6. L2 to L4 will swap MAC addresses, IP
                addresses and src and destination L4 port. Depending on the reflection level required, a different device is used to implement
                the reflector. This field is only valid for an 8.x reflector SAT entity. The default value is l2-to-l4.
              type: str
              required: false
              choices:
              - none
              - l2-only
              - l2-to-l3-ipv4-only
              - l2-to-l3-ipv6-only
              - l2-to-l4-ipv4-only
              - l2-to-l4-ipv6-only
              - l2-to-l4
            reflector_mac_validation:
              description: Used to indicate whether the reflector should classify classify on the mac or not.
              type: bool
              required: false
            role:
              description: SAT entity's mode of operation
              type: str
              required: false
              choices:
              - reflector
              - generator
          key: name
        kpi_profile:
          description: Key performance indicator pass/fail criteria.
          type: list
          elements: dict
          suboptions:
            name:
              description: 'Name of the KPI profile (Key for list: kpi-profile)'
              type: str
              required: true
            pcp:
              description: Each PCP within the KPI profile has its own configuration.
              type: list
              elements: dict
              suboptions:
                pcp_value:
                  description: 'PCP value associated with this entry (Key for list: pcp)'
                  type: int
                  required: true
                frameloss:
                  description: Frameloss KPI for the given KPI profile, PCP and color expressed in percent of bandwidth * 10000 to provide a 4
                    decimal point value.
                  type: int
                  required: false
                latency:
                  description: Maximum latency in milliseconds that the latency result should not exceed in order for the test to be considered
                    a pass.
                  type: int
                  required: false
                max_num_outages:
                  description: Maximum number of outages that can occur during the outage test in order for the test to be considered a pass.
                  type: int
                  required: false
                pdv:
                  description: Maximum PDV in milliseconds that the PDV test result should not exceed in order for the test to be considered a
                    pass.
                  type: int
                  required: false
                single_outage_max:
                  description: Maximum time in milliseconds that any single outage should not exceed in order for the test to be considered a
                    pass.
                  type: int
                  required: false
                sum_outages_max:
                  description: Maximum time in milliseconds that the sum of recorded outages should not exceed in order for the test to be considered
                    a pass.
                  type: int
                  required: false
                throughput:
                  description: Throughput KPI for the given KPI profile, PCP and color expressed in percent of bandwidth * 10000 to provide a
                    4 decimal point value.
                  type: int
                  required: false
              key: pcp-value
            untagged:
              description: Untagged traffic does not have a PCP, so it is handled separately.
              type: dict
              suboptions:
                frameloss:
                  description: Frameloss KPI for the given KPI profile, PCP and color expressed in percent of bandwidth * 10000 to provide a 4
                    decimal point value.
                  type: int
                  required: false
                latency:
                  description: Maximum latency in milliseconds that the latency result should not exceed in order for the test to be considered
                    a pass.
                  type: int
                  required: false
                max_num_outages:
                  description: Maximum number of outages that can occur during the outage test in order for the test to be considered a pass.
                  type: int
                  required: false
                pdv:
                  description: Maximum PDV in milliseconds that the PDV test result should not exceed in order for the test to be considered a
                    pass.
                  type: int
                  required: false
                single_outage_max:
                  description: Maximum time in milliseconds that any single outage should not exceed in order for the test to be considered a
                    pass.
                  type: int
                  required: false
                sum_outages_max:
                  description: Maximum time in milliseconds that the sum of recorded outages should not exceed in order for the test to be considered
                    a pass.
                  type: int
                  required: false
                throughput:
                  description: Throughput KPI for the given KPI profile, PCP and color expressed in percent of bandwidth * 10000 to provide a
                    4 decimal point value.
                  type: int
                  required: false
          key: name
        sat_global:
          description: SAT global configuration data.
          type: dict
          suboptions:
            admin_state:
              description: Overall administrative state of the benchmark feature.
              type: str
              required: false
              choices:
              - disabled
              - enabled
            default_emix_sequence:
              description: Default EMIX sequence to be used on a test instance when no EMIX is specified in the test instance targeted test profile.
                This applies to generator test instances only.
              type: str
              required: false
            generator_default_bw_alloc_profile:
              description: Default bandwidth allocation profile to be used with a test instance when no bandwidth allocation profile is specified
                in the targeted test profile. This applies to generator test instances only.
              type: str
              required: false
            generator_default_kpi_profile:
              description: Default KPI profile to be used to analyze the results of a test instance when no KPI profile is specifed in the targeted
                test profile. This applies to generator test instances only.
              type: str
              required: false
        test_instance:
          description: Service activation test instance configuration data.
          type: list
          elements: dict
          suboptions:
            name:
              description: 'Unique name given to the test instance. (Key for list: test-instance)'
              type: str
              required: true
            admin_state:
              description: Indicates the administrative state of the test instance. Upon enabling a test instance, resources are allocated in
                hardware. For reflector test instances, this triggers the start of reflection of any test traffic received that matches the specified
                vid combination on the specified port/sub-port.
              type: str
              required: false
              choices:
              - disabled
              - enabled
            c_vid:
              description: C VLAN ID to use for testing. For generator test instances, this over-writes the value defined in the referenced test
                profile if applicable (encap-type set to dot1q or qinq). For reflector test instances, this has to be set to a valid c-vid accepted
                by the associated port/sub-port. A value of 0xFFFF indicates ANY c-vid.
              type: int
              required: false
            dst_mac:
              description: Destination MAC address to use for generator test instances. When set, this over writes the value specified in the
                referenced test profile. This field is not applicable for reflector test instances.
              type: str
              required: false
            flow_point_id:
              description: flow-point or sub-port to base this test instance on. The flow-point has to be a child of the logical port under test
                associated with an existing entity.
              type: str
              required: false
            profile:
              description: Name of an existing test profile to be used with the test instance as the template for testing. A test profile ID has
                to be specified if this test instance is associated with a generator entity. If it's a reflector test instance, a profile ID CANNOT
                be specified, it has to remain unset.
              type: str
              required: false
            s_vid:
              description: S VLAN ID to use for testing. For generator test instances, this over-writes the value defined in the referenced test
                profile if applicable (encap-type set to qinq). For reflector test instances, this has to be set to a valid s-vid accepted by
                the associated sub-port. A value of 0xFFFF indicates ANY s-vid.
              type: int
              required: false
            untagged:
              description: When set to true, this indicates that the test instance is to be associated with untagged data traffic. When this is
                set, the cvid and svid parameters must be 0.
              type: bool
              required: false
          key: name
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
