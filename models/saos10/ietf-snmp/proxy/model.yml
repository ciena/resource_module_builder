GENERATOR_VERSION: '2.0'
NETWORK_OS: saos10
RESOURCE: snmp
XML_NAMESPACE: urn:ietf:params:xml:ns:yang:ietf-snmp
XML_ROOT_KEY: snmp
XML_ITEMS: proxy
XML_ITEMS_KEY: name
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: saos10_snmp
  short_description: Top-level container for SNMP-related configuration and status objects.Manage the snmp proxy configuration of a Ciena saos10
    device
  description: "Top-level container for SNMP-related configuration and status objects.\n List of proxy parameters."
  author: Ciena
  options:
    config:
      description: List of proxy parameters.
      type: list
      elements: dict
      suboptions:
        type:
          description: No description available
          type: str
          required: true
          choices:
          - read
          - write
          - trap
          - inform
        context_engine_id:
          description: No description available
          type: str
          required: true
        name:
          description: 'Identifies the proxy parameter entry. (Key for list: proxy)'
          type: str
          required: true
        context_name:
          description: No description available
          type: str
          required: false
        multiple_target_out:
          description: Implementations MAY restrict the values of this leaf to be one of the available values of /snmp/target/tag in a valid configuration.
          type: str
          required: false
        single_target_out:
          description: Implementations MAY restrict the values of this leaf to be one of the available values of /snmp/target/name in a valid
            configuration.
          type: str
          required: false
        target_params_in:
          description: The name of a target parameters list entry. Implementations MAY restrict the values of this leaf to be one of the available
            values of /snmp/target-params/name in a valid configuration.
          type: str
          required: false
      key: name
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
