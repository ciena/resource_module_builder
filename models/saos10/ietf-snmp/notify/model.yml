GENERATOR_VERSION: '2.0'
NETWORK_OS: saos10
RESOURCE: snmp
XML_NAMESPACE: urn:ietf:params:xml:ns:yang:ietf-snmp
XML_ROOT_KEY: snmp
XML_ITEMS: notify
XML_ITEMS_KEY: name
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: saos10_snmp
  short_description: Top-level container for SNMP-related configuration and status objects.Manage the snmp notify configuration of a Ciena saos10
    device
  description: "Top-level container for SNMP-related configuration and status objects.\n Targets that will receive notifications. Entries in this\
    \ list are mapped 1-1 to entries in snmpNotifyTable, except that if an entry in snmpNotifyTable has an snmpNotifyTag for which no snmpTargetAddrEntry\
    \ exists, then the snmpNotifyTable entry is not mapped to an entry in this list."
  author: Ciena
  options:
    config:
      description: Targets that will receive notifications. Entries in this list are mapped 1-1 to entries in snmpNotifyTable, except that if
        an entry in snmpNotifyTable has an snmpNotifyTag for which no snmpTargetAddrEntry exists, then the snmpNotifyTable entry is not mapped
        to an entry in this list.
      type: list
      elements: dict
      suboptions:
        name:
          description: 'An arbitrary name for the list entry. (Key for list: notify)'
          type: str
          required: true
        tag:
          description: Target tag, selects a set of notification targets. Implementations MAY restrict the values of this leaf to be one of the
            available values of /snmp/target/tag in a valid configuration.
          type: str
          required: true
        type:
          description: Defines the notification type to be generated.
          type: str
          required: false
          choices:
          - trap
          - inform
      key: name
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
