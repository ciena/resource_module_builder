GENERATOR_VERSION: '2.0'
NETWORK_OS: saos10
RESOURCE: snmp
XML_NAMESPACE: urn:ietf:params:xml:ns:yang:ietf-snmp
XML_ROOT_KEY: snmp
XML_ITEMS: target-params
XML_ITEMS_KEY: name
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: saos10_snmp
  short_description: Top-level container for SNMP-related configuration and status objects.Manage the snmp target_params configuration of a Ciena
    saos10 device
  description: "Top-level container for SNMP-related configuration and status objects.\n List of target parameters."
  author: Ciena
  options:
    config:
      description: List of target parameters.
      type: list
      elements: dict
      key: name
      suboptions:
        name:
          description: 'No description available (Key for list: target-params)'
          type: str
          required: true
        notify_filter_profile:
          description: This leafref leaf is used to represent the sparse relationship between the /snmp/target-params list and the /snmp/notify-filter-profile
            list.
          type: str
          required: false
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
