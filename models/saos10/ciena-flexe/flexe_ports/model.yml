GENERATOR_VERSION: '2.0'
NETWORK_OS: saos10
RESOURCE: flexe-ports
XML_NAMESPACE: http://www.ciena.com/ns/yang/ciena-flexe
XML_ROOT_KEY: flexe-ports
XML_ITEMS: flexe-port
XML_ITEMS_KEY: name
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: saos10_flexe_ports
  short_description: FlexE port configurationsManage the flexe_ports flexe_port configuration of a Ciena saos10 device
  description: "FlexE port configurations\n List of FlexE ports."
  author: Ciena
  options:
    config:
      description: List of FlexE ports.
      type: list
      elements: dict
      key: name
      suboptions:
        name:
          description: 'Name for FlexE port. (Key for list: flexe-port)'
          type: str
          required: true
        port_speed:
          description: FlexE port speed.
          type: str
          required: true
          choices:
          - 50Gb
          - 100Gb
          - 200Gb
          - 400Gb
        ptp_id:
          description: Unique, access identifier string of the PTP (e.g., '1/1').
          type: str
          required: true
        admin_state:
          description: Overall port admin state.
          type: str
          required: false
          choices:
          - disabled
          - enabled
        forward_error_correction:
          description: Forward error correction
          type: str
          required: false
          choices:
          - auto
          - disabled
          - enabled
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
