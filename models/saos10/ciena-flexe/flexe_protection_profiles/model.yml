GENERATOR_VERSION: '2.0'
NETWORK_OS: saos10
RESOURCE: flexe-protection-profiles
XML_NAMESPACE: http://www.ciena.com/ns/yang/ciena-flexe
XML_ROOT_KEY: flexe-protection-profiles
XML_ITEMS: flexe-protection-profile
XML_ITEMS_KEY: name
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: saos10_flexe_protection_profiles
  short_description: FlexE Protection Profile configurationsManage the flexe_protection_profiles flexe_protection_profile configuration of a Ciena
    saos10 device
  description: "FlexE Protection Profile configurations\n List of FlexE Protection Profiles."
  author: Ciena
  options:
    config:
      description: List of FlexE Protection Profiles.
      type: list
      elements: dict
      key: name
      suboptions:
        name:
          description: 'Name for a FlexE Protection Profile. (Key for list: flexe-protection-profile)'
          type: str
          required: true
        guard_timer:
          description: Time to pause before resuming processing incoming frames after a switching action on this FlexE Protection group.
          type: int
          required: false
        hold_off_timer:
          description: Time to delay before beginning a protection switching action on this FlexE Protection group.
          type: int
          required: false
        protection_mode:
          description: Configuration of protection mode of this FlexE Protection group.
          type: str
          required: false
          choices:
          - 1-plus-1-unidirectional
          - 1-plus-1-bidirectional
          - 1-to-1
          - 1-to-n
        reversion_mode:
          description: Configuration of reversion capabilities of this FlexE Protection group.
          type: str
          required: false
          choices:
          - revertive
          - non-revertive
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
