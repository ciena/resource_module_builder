GENERATOR_VERSION: '2.0'
NETWORK_OS: saos10
RESOURCE: flexe-bas-oams
XML_NAMESPACE: http://www.ciena.com/ns/yang/ciena-flexe
XML_ROOT_KEY: flexe-bas-oams
XML_ITEMS: flexe-bas-oam
XML_ITEMS_KEY: name
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: saos10_flexe_bas_oams
  short_description: FlexE BAS (basic code block) OAM configurationsManage the flexe_bas_oams flexe_bas_oam configuration of a Ciena saos10 device
  description: "FlexE BAS (basic code block) OAM configurations\n List of FlexE BAS (basic code block) OAMs."
  author: Ciena
  options:
    config:
      description: List of FlexE BAS (basic code block) OAMs.
      type: list
      elements: dict
      key: name
      suboptions:
        name:
          description: 'Name for a FlexE BAS (basic code block) OAM. (Key for list: flexe-bas-oam)'
          type: str
          required: true
        tx_enable:
          description: Enable transmission.
          type: bool
          required: false
        tx_period:
          description: Transmission period.
          type: str
          required: false
          choices:
          - 16K
          - 32K
          - 64K
          - 512K
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
