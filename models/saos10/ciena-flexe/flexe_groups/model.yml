GENERATOR_VERSION: '2.0'
NETWORK_OS: saos10
RESOURCE: flexe-groups
XML_NAMESPACE: http://www.ciena.com/ns/yang/ciena-flexe
XML_ROOT_KEY: flexe-groups
XML_ITEMS: flexe-group
XML_ITEMS_KEY: name
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: saos10_flexe_groups
  short_description: FlexE group configurationsManage the flexe_groups flexe_group configuration of a Ciena saos10 device
  description: "FlexE group configurations\n List of FlexE groups."
  author: Ciena
  options:
    config:
      description: List of FlexE groups.
      type: list
      elements: dict
      key: name
      suboptions:
        group_number:
          description: FlexE group number associated to the FlexE group
          type: int
          required: true
        name:
          description: 'Name for FlexE group. (Key for list: flexe-group)'
          type: str
          required: true
        phy_type:
          description: Type of PHY used in the FlexE group, such as 50/100/200/400GBASE-R. All PHYs in a FlexE group should be of same type
          type: str
          required: true
          choices:
          - flexe-phy-50GBASE-R
          - flexe-phy-100GBASE-R
          - flexe-phy-200GBASE-R
          - flexe-phy-400GBASE-R
        admin_state:
          description: Overall FlexE group admin state.
          type: str
          required: false
          choices:
          - disabled
          - enabled
        calendar:
          description: Calendar configuration used in FlexE Mux/Demux
          type: str
          required: false
          choices:
          - calendar-A
          - calendar-B
        calendar_protocol_enable:
          description: Whether calendar negotiation protocol is enabled or not.
          type: bool
          required: false
        calendar_slot_granularity:
          description: The granularity of calendar slot is 5G or 25G
          type: str
          required: false
          choices:
          - slot-5G
          - slot-25G
        flexe_phys:
          description: List of the participating PHYs in a FlexE group
          type: list
          elements: dict
          suboptions:
            local_interface:
              description: Local FlexE port interface related to the current phy-number in a FlexE group.
              type: str
              required: true
            phy_number_in_group:
              description: 'Refer to the clause 6.1 in FlexE IA 2.1. For 100GBASE-R, the FlexE PHY num and the 100G FlexE instance num are the
                same and in the range [1-254]; For 200GBASE-R, each PHY num is in the range [1-126]. For 400GBASE-R, each PHY num is in the range
                [1-62]. For 50GBASE-R, each PHY num is in the range [1-126]. PHY num configured in list of flexe-phys should be in ascending order.
                (Key for list: flexe-phys)'
              type: int
              required: true
          key: phy-number-in-group
        sc_bit_enable:
          description: When this field is set true, the FlexE SC bit is set to 1, otherwise the FlexeE SC bit is 0.
          type: bool
          required: false
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
