GENERATOR_VERSION: '2.0'
NETWORK_OS: saos10
RESOURCE: flexe-channels
XML_NAMESPACE: http://www.ciena.com/ns/yang/ciena-flexe
XML_ROOT_KEY: flexe-channels
XML_ITEMS: flexe-channel
XML_ITEMS_KEY: name
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: saos10_flexe_channels
  short_description: FlexE channel configurationsManage the flexe_channels flexe_channel configuration of a Ciena saos10 device
  description: "FlexE channel configurations\n List of FlexE channels."
  author: Ciena
  options:
    config:
      description: List of FlexE channels.
      type: list
      elements: dict
      key: name
      suboptions:
        channel_number:
          description: Channel number associated to the FlexE channel.
          type: int
          required: true
        group_name:
          description: Name of FlexE group to which this FlexE channel will be associated to.
          type: str
          required: true
        name:
          description: 'Name for FlexE channel. (Key for list: flexe-channel)'
          type: str
          required: true
        bas_oam:
          description: BAS (basic code block) OAM related to FlexE channel.
          type: str
          required: false
        calendar_A_slots_list:
          description: List of slots allocated on Calendar A for a FlexE channel. Number of slots allocated for a FlexE channel is based on the
            bandwidth allocated for it. Ex; For a system with calendar slot granularity of 5G, a 10G FlexE channel would be allocated 2 slots
            (10G/5G)
          type: list
          elements: dict
          suboptions:
            phy_number_in_group:
              description: 'PHY number index from the list of PHYs associated to the FlexE group. Refer to the clause 6.1 in FlexE IA 2.1. For
                100GBASE-R, the FlexE PHY num and the 100G FlexE instance num are the same and in the range [1-254]; For 200GBASE-R, each PHY
                num is in the range [1-126]. For 400GBASE-R, each PHY num is in the range [1-62]. For 50GBASE-R, each PHY num is in the range
                [1-126]. (Key for list: calendar-A-slots-list)'
              type: str
              required: true
            slot_id:
              description: 'Slot number within the list of slots associated to the PHY. Ex; For 100G PHY range is [1..20] For 200G PHY range is
                [1..40] For 400G PHY range is [1..80] (Key for list: calendar-A-slots-list)'
              type: int
              required: true
          key: phy-number-in-group slot-id
        calendar_B_slots_list:
          description: List of slots allocated on Calendar B for a FlexE channel. Number of slots allocated for a FlexE channel is based on the
            bandwidth allocated for it. Ex; For a system with calendar slot granularity of 5G, a 10G FlexE-channel would be allocated 2 slots
            (10G/5G)
          type: list
          elements: dict
          suboptions:
            phy_number_in_group:
              description: 'PHY number index from the list of PHYs associated to the FlexE group. Refer to the clause 6.1 in FlexE IA 2.1. For
                100GBASE-R, the FlexE PHY num and the 100G FlexE instance num are the same and in the range [1-254]; For 200GBASE-R, each PHY
                num is in the range [1-126]. For 400GBASE-R, each PHY num is in the range [1-62]. For 50GBASE-R, each PHY num is in the range
                [1-126]. (Key for list: calendar-B-slots-list)'
              type: str
              required: true
            slot_id:
              description: 'Slot number within the list of slots associated to the PHY. Ex; For 100G PHY range is [1..20] For 200G PHY range is
                [1..40] For 400G PHY range is [1..80] (Key for list: calendar-B-slots-list)'
              type: int
              required: true
          key: phy-number-in-group slot-id
        channel_mapping:
          description: FlexE Datapath, traffic mapped at L1/L2/L3
          type: str
          required: false
          choices:
          - L1-mapped
          - L2-mapped
        oam_bypass_enable:
          description: Enable OAM bypass.
          type: bool
          required: false
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
