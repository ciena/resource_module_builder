DOCUMENTATION:
  module: saos10_rib__properties
  short_description: IP routing tableManage the rib__properties properties configuration of a Ciena saos10 device
  description: IP routing table
  author: Ciena
  options:
    config:
      description: IP routing table
      type: dict
      suboptions:
        protocol:
          description: IP RIB protocol options.
          type: dict
          suboptions:
            purge:
              description: Purge routes options.
              type: dict
              suboptions:
                interface:
                  description: When true, protocols will remove unreachable routes when dependent interface is down.
                  type: bool
                  required: false
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
