GENERATOR_VERSION: '2.0'
NETWORK_OS: saos10
RESOURCE: sat
XML_NAMESPACE: http://www.ciena.com/ns/yang/ciena-sat
XML_ROOT_KEY: sat
XML_ITEMS: emix-sequence
XML_ITEMS_KEY: name
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: saos10_sat
  short_description: SAT configuration data.Manage the sat emix_sequence configuration of a Ciena saos10 device
  description: "SAT configuration data.\n EMIX sequence entry."
  author: Ciena
  options:
    config:
      description: EMIX sequence entry.
      type: list
      elements: dict
      suboptions:
        name:
          description: 'Name of this EMIX sequence (Key for list: emix-sequence)'
          type: str
          required: true
        sequence:
          description: EMIX sequence which is a sequence of up to 16 letters from the following set, that can be repeated, where each letter is
            associated with the frame size below it; a b c d e f g h u v w x 64 128 256 512 1024 1280 1518 MTU custom 84 68 88 The u frame size
            is user configurable via the emix-sequence-UFrameSize attribute while the h frame size is the maximum frame size configured at the
            entity level. If the h frame size is not configured at the entity level, h takes the value of the maximum frame size of the port under
            test. Letter v is the minimum frame size for IPv6 untagged or dot1q test frames, w is the minimum for IPv4 qinq test frames, and x
            is the minimum for IPv6 qinq test frames. The EMIX character set is available via the emix-sequence-character-set list.
          type: str
          required: false
        u_frame_size:
          description: The frame size associated with the u letter in the given sequence. The default value is 594.
          type: int
          required: false
      key: name
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
