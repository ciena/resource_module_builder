GENERATOR_VERSION: '2.0'
NETWORK_OS: saos10
RESOURCE: g8032-rings
XML_NAMESPACE: http://www.ciena.com/ns/yang/ciena-itut-g8032-draft
XML_ROOT_KEY: g8032-rings
XML_ITEMS: null
XML_ITEMS_KEY: null
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: saos10_g8032_rings__properties
  short_description: Contains all the G.8032 system specific related configuration.Manage the g8032_rings__properties properties configuration
    of a Ciena saos10 device
  description: Contains all the G.8032 system specific related configuration.
  author: Ciena
  options:
    config:
      notification_enabled:
        description: Enable/disable ring status change notification. If true, any change in ring state will be notified via ring-state-change
          notification.
        type: bool
        required: false
      raps_version:
        description: The version of the ERP R-APS protocol being used.
        type: str
        required: false
        choices:
        - g8032-version-type
        - g8032-version2
        - g8032-version1
      ring_system_control:
        description: Setting this control allows the enablement or disablement of the G.8032 protection switching on a system wide basis.
        type: str
        required: false
        choices:
        - disabled
        - enabled
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
