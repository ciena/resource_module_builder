GENERATOR_VERSION: '2.0'
NETWORK_OS: saos10
RESOURCE: l2vpn-services
XML_NAMESPACE: http://ciena.com/ns/yang/ciena-l2vpn
XML_ROOT_KEY: l2vpn-services
XML_ITEMS: l2vpn
XML_ITEMS_KEY: name
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: saos10_l2vpn_services
  short_description: List of layer-2 VPN services instances.Manage the l2vpn_services l2vpn configuration of a Ciena saos10 device
  description: "List of layer-2 VPN services instances.\n L2VPN services instance"
  author: Ciena
  options:
    config:
      description: L2VPN services instance
      type: list
      elements: dict
      key: name
      suboptions:
        name:
          description: 'L2vpn-services instance name (Key for list: l2vpn)'
          type: str
          required: true
        auto_discovery_protocol:
          description: 'User provided protocol to disable or enable auto-discovery in VPLS-AD '
          type: str
          required: false
          choices:
          - none
          - bgp
        cc_types:
          description: Used to set the CC Type for VPLS-AD signaled pseudowires
          type: list
          required: false
          elements: str
          choices:
          - cctype-1
          - cctype-2
          - cctype-3
          - cctype-4
        control_word:
          description: Control-word is enabled by default for VPLS-AD signaled pseudowires
          type: bool
          required: false
        fallback:
          description: Fallback enable is used when the SR policy is down. The service will still continue to be up, but will fall back to labeled
            IGP shortest path. By default, the value is set to disable.
          type: str
          required: false
          choices:
          - disable
          - enable
        fat_capability:
          description: Used to set FAT pseudowire capability for negotiation of VPLS-AD signaled pseudowires
          type: str
          required: false
          choices:
          - tx-rx
          - rx
          - tx
        forwarding_domain:
          description: Mention the forwarding domain name
          type: str
          required: false
        mtu:
          description: This attribute sets the Maximum Transmission Unit(MTU) for a L2VPN service
          type: int
          required: false
        pseudowire:
          description: Mention the pseudowire names required for l2vpn service
          type: list
          elements: str
        pw_loadbalance:
          description: Used to set PW load balance parameter for VPLS-AD signaled pseudowires
          type: str
          required: false
          choices:
          - disabled
          - fat-pw
          - entropy
        pw_stats_enable:
          description: List of stats enabled VPLS-AD pseudowire names
          type: list
          elements: str
        service_type:
          description: The service type as Vlan or Ethernet, Ethernet is default.
          type: str
          required: false
          choices:
          - vlan
          - ethernet
        signaling_type:
          description: The signaling type to be used for L2VPN signaling in VPLS-AD
          type: str
          required: false
          choices:
          - ldp
        tunnel_color:
          description: User provided tunnel-color for underlying transport
          type: int
          required: false
        vc_mode_revertive:
          description: If true, vc-mode-revertive is enabled.
          type: bool
          required: false
        vpn_id:
          description: User provided L2VPN VPN identifier for VPLS-AD
          type: int
          required: false
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
