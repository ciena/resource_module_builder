GENERATOR_VERSION: '2.0'
NETWORK_OS: waveserverai
RESOURCE: waveserver-lldp
XML_NAMESPACE: urn:ciena:params:xml:ns:yang:ciena-ws:ciena-waveserver-lldp
XML_ROOT_KEY: waveserver-lldp
XML_ITEMS: interface-port
XML_ITEMS_KEY: name
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: waveserverai_waveserver_lldp
  short_description: Waveserver LLDP configuration and operational data.Manage the waveserver_lldp interface_port configuration of a Ciena waveserverai
    device
  description: "Waveserver LLDP configuration and operational data.\n Interface Port LLDP configuration and operational data."
  author: Ciena
  options:
    config:
      description: Interface Port LLDP configuration and operational data.
      type: list
      elements: dict
      suboptions:
        name:
          description: 'Interface Port name string. (Key for list: interface-port)'
          type: str
          required: true
        properties:
          description: LLDP port level properties.
          type: dict
          suboptions:
            mode:
              description: LLDP port mode
              type: str
              required: false
              choices:
              - unknown
              - tx-only
              - snoop
              - tx-rx
              - disabled
            notification:
              description: Turn notification on or off
              type: str
              required: false
              choices:
              - 'off'
              - 'on'
      key: name
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
