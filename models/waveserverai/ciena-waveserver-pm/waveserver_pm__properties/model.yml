GENERATOR_VERSION: '2.0'
NETWORK_OS: waveserverai
RESOURCE: waveserver-pm
XML_NAMESPACE: urn:ciena:params:xml:ns:yang:ciena-ws:ciena-waveserver-pm
XML_ROOT_KEY: waveserver-pm
XML_ITEMS: null
XML_ITEMS_KEY: null
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: waveserverai_waveserver_pm__properties
  short_description: Waveserver performance monitoring configuration and operational data.Manage the waveserver_pm configuration of a Ciena waveserverai
    device
  description: Waveserver performance monitoring configuration and operational data.
  author: Ciena
  options:
    config:
      description: Waveserver performance monitoring configuration and operational data.
      type: dict
      suboptions:
        global_config:
          description: Performance monitoring global configuration on the Waveserver.
          type: dict
          suboptions:
            admin_state:
              description: Global admin state.
              type: str
              required: false
              choices:
              - disabled
              - enabled
            tca_admin_state:
              description: Global TCA administrative state.
              type: str
              required: false
              choices:
              - disabled
              - enabled
            tca_notification_type:
              description: Global TCA notification type.
              type: str
              required: false
              choices:
              - summary-event
              - summary-alarm
              - event
              - alarm
            untimed_read_and_clear:
              description: Global configuration for clearing untimed bin stats on a get request.
              type: str
              required: false
              choices:
              - disabled
              - enabled
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
