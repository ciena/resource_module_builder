GENERATOR_VERSION: '2.0'
NETWORK_OS: waveserverai
RESOURCE: waveserver-snmp
XML_NAMESPACE: urn:ciena:params:xml:ns:yang:ciena-ws:ciena-waveserver-snmp
XML_ROOT_KEY: waveserver-snmp
XML_ITEMS: null
XML_ITEMS_KEY: null
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: waveserverai_waveserver_snmp__properties
  short_description: Waveserver SNMP configuration and operational data.Manage the waveserver_snmp configuration of a Ciena waveserverai device
  description: Waveserver SNMP configuration and operational data.
  author: Ciena
  options:
    config:
      description: Waveserver SNMP configuration and operational data.
      type: dict
      suboptions:
        global_config:
          description: Global configuration attributes for the SNMP engine.
          type: dict
          suboptions:
            admin_state:
              description: SNMP engine administrative state.
              type: str
              required: false
              choices:
              - disabled
              - enabled
            contact:
              description: SNMP system contact string.
              type: str
              required: false
            local_port:
              description: UDP port number on which snmp agent listens. Default is 161.
              type: int
              required: false
            location:
              description: SNMP system location string.
              type: str
              required: false
            standard_link_traps_admin_state:
              description: Specifies whether standard link up/down trap notifications are enabled or disabled.
              type: str
              required: false
              choices:
              - disabled
              - enabled
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
