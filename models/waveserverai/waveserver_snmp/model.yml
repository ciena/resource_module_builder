GENERATOR_VERSION: '2.0'
NETWORK_OS: waveserverai
RESOURCE: waveserver-snmp
XML_NAMESPACE: urn:ciena:params:xml:ns:yang:ciena-ws:ciena-waveserver-snmp
XML_ROOT_KEY: waveserver-snmp
XML_ITEMS: access
XML_ITEMS_KEY: entry sec-model sec-level
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: waveserverai_waveserver_snmp
  short_description: Waveserver SNMP configuration and operational data.Manage the waveserver_snmp access configuration of a Ciena waveserverai
    device
  description: "Waveserver SNMP configuration and operational data.\n List of access entry profiles, defining access privileges and MIB read/write\
    \ and notification view filters for a particular user class group of users."
  author: Ciena
  options:
    config:
      description: List of access entry profiles, defining access privileges and MIB read/write and notification view filters for a particular
        user class group of users.
      type: list
      elements: dict
      suboptions:
        entry:
          description: 'Entry name. Uniquely identifies the access entry/group in the list. (Key for list: access)'
          type: str
          required: true
        read_view:
          description: Read view type. Each access entry profile must have a read view assigned to it.
          type: str
          required: true
        sec_level:
          description: 'The security level associated with this access entry. (Key for list: access)'
          type: str
          required: true
          choices:
          - no-auth-no-priv
          - auth-no-priv
          - auth-priv
        sec_model:
          description: 'The security model associated with this access entry. (Key for list: access)'
          type: str
          required: true
          choices:
          - v1
          - v2c
          - usm
        notify_view:
          description: Notify view type, optional.
          type: str
          required: false
        write_view:
          description: Write view type, optional.
          type: str
          required: false
      key: entry sec-model sec-level
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
