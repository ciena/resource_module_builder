GENERATOR_VERSION: '2.0'
NETWORK_OS: waveserverai
RESOURCE: waveserver-chassis
XML_NAMESPACE: urn:ciena:params:xml:ns:yang:ciena-ws:ciena-waveserver-chassis
XML_ROOT_KEY: waveserver-chassis
XML_ITEMS: cooling-fan-units
XML_ITEMS_KEY: cfu-id
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: waveserverai_waveserver_chassis
  short_description: Waveserver chassis configuration data and operational data.Manage the waveserver_chassis cooling_fan_units configuration
    of a Ciena waveserverai device
  description: "Waveserver chassis configuration data and operational data.\n Cooling Fan Unit Status."
  author: Ciena
  options:
    config:
      description: Cooling Fan Unit Status.
      type: list
      elements: dict
      suboptions:
        cfu_id:
          description: 'Unique id for the Cooling Fan Unit list entry. (Key for list: cooling-fan-units)'
          type: str
          required: true
        state:
          description: Cooling Fan Unit state information.
          type: dict
          suboptions:
            admin_state:
              description: Whether Admin State of the cooling fan unit is enabled or disabled. Disabled state masks the alarms only.
              type: str
              required: false
              choices:
              - disabled
              - enabled
      key: cfu-id
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
