DOCUMENTATION:
  module: waveserverai_waveserver_pkix
  short_description: Waveserver Public-Key Infrastructure and X.509 configuration data and operational data.Manage the pkix configuration of a
    Ciena waveserverai device
  description: Waveserver Public-Key Infrastructure and X.509 configuration data and operational data.
  author: Ciena
  options:
    config:
      description: Waveserver Public-Key Infrastructure and X.509 configuration data and operational data.
      type: dict
      suboptions:
        support_rsa2048:
          description: A backward compatibility option to re-enable 2048bit RSA key length support.
          type: dict
          suboptions:
            admin_state:
              description: Indicate whether backward compatibility to support 2048bit RSA key length is enabled.
              type: str
              required: false
              choices:
              - disabled
              - enabled
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
