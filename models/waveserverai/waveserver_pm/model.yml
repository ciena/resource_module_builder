GENERATOR_VERSION: '2.0'
NETWORK_OS: waveserverai
RESOURCE: waveserver-pm
XML_NAMESPACE: urn:ciena:params:xml:ns:yang:ciena-ws:ciena-waveserver-pm
XML_ROOT_KEY: waveserver-pm
XML_ITEMS: encryption-gcm-performance-instances
XML_ITEMS_KEY: instance-name
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: waveserverai_waveserver_pm
  short_description: Waveserver performance monitoring configuration and operational data.Manage the waveserver_pm encryption_gcm_performance_instances
    configuration of a Ciena waveserverai device
  description: "Waveserver performance monitoring configuration and operational data.\n Channel Encryption-GCM PM instances."
  author: Ciena
  options:
    config:
      description: Channel Encryption-GCM PM instances.
      type: list
      elements: dict
      suboptions:
        instance_name:
          description: 'Unique name for PM instance. (Key for list: encryption-gcm-performance-instances)'
          type: str
          required: true
        properties:
          description: PM instance properties.
          type: dict
          suboptions:
            tca_profile_15_min:
              description: TCA profile name that is attached to the current 15 minute bin
              type: str
              required: false
            tca_profile_24_hr:
              description: TCA profile name that is attached to the current 24 hour bin
              type: str
              required: false
            tca_profile_untimed:
              description: TCA profile name that is attached to the untimed bin
              type: str
              required: false
        state:
          description: PM instance state.
          type: dict
          suboptions:
            admin_state:
              description: The configured administrative state of the port.
              type: str
              required: false
              choices:
              - disabled
              - enabled
            tca_admin_state:
              description: The configured TCA administrative state for this PM instance.
              type: str
              required: false
              choices:
              - disabled
              - enabled
      key: instance-name
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
