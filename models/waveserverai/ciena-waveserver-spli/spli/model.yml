DOCUMENTATION:
  module: waveserverai_waveserver_spli
  short_description: Waveserver SPLI top level container.Manage the spli configuration of a Ciena waveserverai device
  description: Waveserver SPLI top level container.
  author: Ciena
  options:
    config:
      description: Waveserver SPLI top level container.
      type: dict
      suboptions:
        global_config:
          description: Waveserver SPLI global configuration and operational data.
          type: dict
          suboptions:
            admin_state:
              description: Specifies whether SPLI is enabled globally at the chassis level.
              type: str
              required: false
              choices:
              - disabled
              - enabled
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
