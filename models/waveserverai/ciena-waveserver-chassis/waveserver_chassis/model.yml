GENERATOR_VERSION: '2.0'
NETWORK_OS: waveserverai
RESOURCE: waveserver-chassis
XML_NAMESPACE: urn:ciena:params:xml:ns:yang:ciena-ws:ciena-waveserver-chassis
XML_ROOT_KEY: waveserver-chassis
XML_ITEMS: slot
XML_ITEMS_KEY: slot-id
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: waveserverai_waveserver_chassis
  short_description: Waveserver chassis configuration data and operational data.Manage the waveserver_chassis slot configuration of a Ciena waveserverai
    device
  description: "Waveserver chassis configuration data and operational data.\n Chassis slot power management."
  author: Ciena
  options:
    config:
      description: Chassis slot power management.
      type: list
      elements: dict
      key: slot-id
      suboptions:
        slot_id:
          description: 'Chassis slot number, Key value for the chassis slot list. (Key for list: slot)'
          type: int
          required: true
        power_state:
          description: Slot power state.
          type: str
          required: false
          choices:
          - automatic
          - shutdown
        sub_slot:
          description: Chassis sub-slot power management.
          type: list
          elements: dict
          suboptions:
            sub_slot_id:
              description: 'Chassis sub-slot id, Key value for the chassis sub-slot list. (Key for list: sub-slot)'
              type: str
              required: true
            power_state:
              description: Sub-slot power state.
              type: str
              required: false
              choices:
              - automatic
              - shutdown
          key: sub-slot-id
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
