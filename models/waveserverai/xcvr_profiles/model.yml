GENERATOR_VERSION: '2.0'
NETWORK_OS: waveserverai
RESOURCE: waveserver-xcvrs
XML_NAMESPACE: urn:ciena:params:xml:ns:yang:ciena-ws:ciena-waveserver-xcvr
XML_ROOT_KEY: waveserver-xcvrs
XML_ITEMS: xcvr-profiles
XML_ITEMS_KEY: xcvr-profile-index
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: waveserverai_waveserver_xcvrs
  short_description: Waveserver transceivers (XCVR) configuration and operational data.Manage the waveserver_xcvrs xcvr_profiles configuration
    of a Ciena waveserverai device
  description: "Waveserver transceivers (XCVR) configuration and operational data.\n List of XCVR profiles."
  author: Ciena
  options:
    config:
      description: List of XCVR profiles.
      type: list
      elements: dict
      suboptions:
        xcvr_profile_index:
          description: 'XCVR tranceiver profile index, unique, key value for the XCVR Profile List. (Key for list: xcvr-profiles)'
          type: int
          required: true
        description:
          description: The description of the profile to uniquely identify the XCVR and its profile.
          type: str
          required: false
        id:
          description: Identification information of this XCVR Profile instance.
          type: dict
          suboptions:
            vendor_name:
              description: Name of the XCVR vendor.
              type: str
              required: false
            vendor_oui:
              description: OUI of the XCVR vendor.
              type: str
              required: false
            vendor_pn:
              description: XCVR vendor part number.
              type: str
              required: false
            vendor_rev:
              description: XCVR vendor revision.
              type: str
              required: false
        properties:
          description: Configurable attributes of the XCVR profile.
          type: dict
          suboptions:
            rx_thresholds:
              description: Receiver power thresholds of the XCVR profile. These threshold attributes will not affect the traffic. Modifying these
                thresholds to values which are different from the manufacture recommended values will impact the XCVR optical power alarms/warnings.
              type: dict
              suboptions:
                high_alarm_threshold:
                  description: Optical power high alarm threshold, in dBm. If it is modem Tx-power, the threshold can change based on provisioned
                    tx power. High threshold = target power + 3.
                  type: float
                  required: false
                high_warning_threshold:
                  description: Optical power high warning threshold, in dBm.
                  type: float
                  required: false
                low_alarm_threshold:
                  description: Optical power low alarm threshold, in dBm. If it is modem Tx-power, the threshold can change based on provisioned
                    tx power. Low threshold = target power - 10.
                  type: float
                  required: false
                low_warning_threshold:
                  description: Optical power low warning threshold, in dBm.
                  type: float
                  required: false
            tx_optical_power_monitoring_override:
              description: To override the transmit power monitor for plugs even though the setting of the transmit power monitor capability in
                EEPROM of the plug is not to allow monitoring. True means to allow monitoring irrespective of the EEPROM setting. And, False means
                no override.
              type: bool
              required: false
            tx_thresholds:
              description: Transmit power thresholds of the XCVR profile. These threshold attributes will not affect the traffic. Modifying these
                thresholds to values which are different from the manufacture recommended values will impact the XCVR optical power alarms/warnings.
              type: dict
              suboptions:
                high_alarm_threshold:
                  description: Optical power high alarm threshold, in dBm. If it is modem Tx-power, the threshold can change based on provisioned
                    tx power. High threshold = target power + 3.
                  type: float
                  required: false
                high_warning_threshold:
                  description: Optical power high warning threshold, in dBm.
                  type: float
                  required: false
                low_alarm_threshold:
                  description: Optical power low alarm threshold, in dBm. If it is modem Tx-power, the threshold can change based on provisioned
                    tx power. Low threshold = target power - 10.
                  type: float
                  required: false
                low_warning_threshold:
                  description: Optical power low warning threshold, in dBm.
                  type: float
                  required: false
      key: xcvr-profile-index
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
