GENERATOR_VERSION: '2.0'
NETWORK_OS: waveserverai
RESOURCE: modules
XML_NAMESPACE: urn:ciena:params:xml:ns:yang:ciena-ws:ciena-waveserver-module
XML_ROOT_KEY: waveserver-modules
XML_ITEMS: modules
XML_ITEMS_KEY: module-id
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: waveserverai_waveserver_modules
  short_description: Waveserver service module configuration data and operational data.Manage the modules modules configuration of a Ciena waveserverai
    device
  description: "Waveserver service module configuration data and operational data.\n Module list."
  author: Ciena
  options:
    config:
      description: Module list.
      type: list
      elements: dict
      key: module-id
      suboptions:
        module_id:
          description: 'Unique access identifier string of the Module, which may just be a slot number (e.g. ''1''). Key value for the Module
            list. Read-only attribute. (Key for list: modules)'
          type: str
          required: true
        id:
          description: ID information of this Module instance.
          type: dict
          suboptions:
            type:
              description: The service module type. Must be specified on creation, and cannot be modified.
              type: str
              required: true
              choices:
              - unknown
              - filler
              - motr-100-2
              - cmd-4
              - motr-100-1
              - motr-crypto
              - cmd-10
              - motr-100-2p
              - motr-agg-1
              - motr-400-2-16
              - motr-400-1-8
              - motr-dco-400-3-12
              - motr-400-2-12
              - motr-crypto-400-2-16
              - motr-dco-400-2-8
              - m-ops-3
              - p-ops-2p
              - reserved-1
            label:
              description: The user-specified label string for this module.
              type: str
              required: false
        properties:
          description: Configuration properties of this Module instance.
          type: dict
          suboptions:
            mode:
              description: The module configuration mode.
              type: str
              required: false
              choices:
              - none
              - oducn-regen
              - mated
              - mated-oducn-regen
        state:
          description: State information of this Module instance.
          type: dict
          suboptions:
            admin_state:
              description: Whether Admin State is enabled or disabled for this Module.
              type: str
              required: false
              choices:
              - disabled
              - enabled
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
