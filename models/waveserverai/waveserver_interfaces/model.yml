GENERATOR_VERSION: '2.0'
NETWORK_OS: waveserverai
RESOURCE: waveserver-interfaces
XML_NAMESPACE: urn:ciena:params:xml:ns:yang:ciena-ws:ciena-waveserver-interfaces
XML_ROOT_KEY: waveserver-interfaces
XML_ITEMS: logical-interface
XML_ITEMS_KEY: name
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: waveserverai_waveserver_interfaces
  short_description: Top level container for configuration and operational data for physical and logical network interfaces.Manage the waveserver_interfaces
    logical_interface configuration of a Ciena waveserverai device
  description: "Top level container for configuration and operational data for physical and logical network interfaces.\n List of logical IP management\
    \ interfaces (e.g. 'local')."
  author: Ciena
  options:
    config:
      description: List of logical IP management interfaces (e.g. 'local').
      type: list
      elements: dict
      suboptions:
        name:
          description: 'References the system-assigned name of the logical interface. (Key for list: logical-interface)'
          type: str
          required: true
        id:
          description: Identification information of this logical management interface.
          type: dict
          suboptions:
            name:
              description: The name of the logical management interface, e.g. 'local'.
              type: str
              required: false
        properties:
          description: All the configuration data of the logical management interface.
          type: dict
          suboptions:
            ipv4:
              description: IPv4 configuration and operational data. It only applies to external interfaces
              type: dict
              suboptions:
                admin_state:
                  description: Whether IPv4 stack is enabled or disabled on this interface. Always enabled for the local management interface.
                  type: str
                  required: false
                  choices:
                  - disabled
                  - enabled
                backup_gateway:
                  description: The user-configured backup IPv4 gateway on the interface.
                  type: str
                  required: false
                user_gateway:
                  description: The user-configured primary IPv4 gateway on the interface.
                  type: str
                  required: false
                user_ip_address:
                  description: The user-configured IPv4 address and prefix on the interface.
                  type: str
                  required: false
            ipv6:
              description: IPv6 configuration and operational data. It only applies to external interfaces
              type: dict
              suboptions:
                gateway_configuration:
                  description: All the configuration data of IPv6 gateway.
                  type: dict
                  suboptions:
                    ip_address:
                      description: The user-configured IPv6 gateway on the interface.
                      type: str
                      required: false
                    source:
                      description: The IPv6 gateway address type.
                      type: str
                      required: false
                      choices:
                      - manual
                      - dhcp
                      - apipa
                      - dhcpv6
                      - slaac
                      - local
                user_ip_address:
                  description: List of provisioned IPv6 addresses.
                  type: list
                  elements: dict
                  suboptions:
                    ip_address:
                      description: 'The user-configured IPv6 address and prefix on the interface. (Key for list: user-ip-address)'
                      type: str
                      required: true
                  key: ip-address
        state:
          description: Logical interface state information.
          type: dict
          suboptions:
            admin_state:
              description: Whether Admin State is enabled or disabled for this management interface.
              type: str
              required: false
              choices:
              - disabled
              - enabled
      key: name
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
