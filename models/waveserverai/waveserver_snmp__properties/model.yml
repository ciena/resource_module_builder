GENERATOR_VERSION: '2.0'
NETWORK_OS: waveserverai
RESOURCE: waveserver-snmp
XML_NAMESPACE: urn:ciena:params:xml:ns:yang:ciena-ws:ciena-waveserver-snmp
XML_ROOT_KEY: waveserver-snmp
XML_ITEMS: null
XML_ITEMS_KEY: null
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: waveserverai_waveserver_snmp__properties
  short_description: Waveserver SNMP configuration and operational data.Manage the waveserver_snmp__properties properties configuration of a Ciena
    waveserverai device
  description: Waveserver SNMP configuration and operational data.
  author: Ciena
  options:
    config:
      community:
        description: List of community entries for SNMP v1 and v2c security.
        type: list
        elements: dict
        suboptions:
          community_name:
            description: SNMP community name, represented as a string.
            type: str
            required: true
          index:
            description: 'Index into the community list. (Key for list: community)'
            type: str
            required: true
          security_name:
            description: SNMP security name, represented as a string.
            type: str
            required: true
          context_name:
            description: The context in which management information is accessed when using the community string specified by this entry.
            type: str
            required: false
          transport_tag:
            description: Used to limit access for this community to the specified target(s).
            type: str
            required: false
        key: index
      global_config:
        description: Global configuration attributes for the SNMP engine.
        type: dict
        suboptions:
          admin_state:
            description: SNMP engine administrative state.
            type: str
            required: false
            choices:
            - disabled
            - enabled
          contact:
            description: SNMP system contact string.
            type: str
            required: false
          local_port:
            description: UDP port number on which snmp agent listens. Default is 161.
            type: int
            required: false
          location:
            description: SNMP system location string.
            type: str
            required: false
          standard_link_traps_admin_state:
            description: Specifies whether standard link up/down trap notifications are enabled or disabled.
            type: str
            required: false
            choices:
            - disabled
            - enabled
      notify:
        description: List of notification target entries. Used to select management targets which should receive notifications, as well as the
          type of notification which should be sent to each selected management target.
        type: list
        elements: dict
        suboptions:
          name:
            description: 'Notify name. Uniquely identifies the notify entry in the list. (Key for list: notify)'
            type: str
            required: true
          notify_tag:
            description: Notify tag name. Contains a single tag value which is used to select entries in the target list (target address table).
              Any entry in the target list which contains this tag value will be selected for this notify target. If the tag value is an empty
              string, then no entries will be selected.
            type: str
            required: true
          notify_type:
            description: The type of notification to be generated for entries in the target list selected by the notify-tag value. Default is
              trap.
            type: str
            required: false
            choices:
            - trap
            - inform
        key: name
      security_to_group:
        description: List of security-to-group entries. A double-keyed list of entries identified by security criteria (name and model) which
          can be assigned to an access group name. Security groups can be created to identify sets of users with similar read/write access control
          permissions or notification view filtering.
        type: list
        elements: dict
        suboptions:
          group:
            description: A user-assigned access entry group name identifying a group of users with similar access control permissions, notification
              view, etc. This group name is used as an index into the access list to select an access control policy, however it does not imply
              or guarantee that an instance with this name actually exists in the access table.
            type: str
            required: true
          sec_model:
            description: 'The security model associated with this security-to-group entry. (Key for list: security-to-group)'
            type: str
            required: true
            choices:
            - v1
            - v2c
            - usm
          user:
            description: 'User name string (SNMPv3) or community string (SNMPv1, SNMPv2) associated with the security group. (Key for list: security-to-group)'
            type: str
            required: true
        key: user sec-model
      target:
        description: List of target transport addresses (e.g. trap destinations) to be used in the generation of SNMP messages.
        type: list
        elements: dict
        suboptions:
          address:
            description: The SNMP target transport address, as an IPv4 address with optional prefix length, or hostname format.
            type: str
            required: true
          name:
            description: 'SNMP trap target name. Uniquely identifies the target entry in the list. (Key for list: target)'
            type: str
            required: true
          target_params:
            description: Identifies an entry in the target-params list. The identified entry contains SNMP parameters to be used when generating
              messages to be sent to this target transport address. If the selected entry in the target-params list does not exist, the management
              target will not be used to generate notifications.
            type: str
            required: true
          port:
            description: UDP port number associated with the target entry. Default is 162.
            type: int
            required: false
          retry_count:
            description: The default number of retries to be attempted when a response is not received for a generate message to this target transport
              address.
            type: int
            required: false
          tag:
            description: Tag value used to select one or more target address entries for a particular operation.
            type: str
            required: false
          timeout:
            description: The expected maximum round trip time for communicating with this target transport address, expressed in hundredths of
              a second.
            type: int
            required: false
          transport_domain:
            description: Indicates the transport type of the address contained in this SNMP target entry. Default is 'snmp-udp'.
            type: str
            required: false
            choices:
            - snmp-udp
            - v4-udp
            - v6-udp
        key: name
      target_params:
        description: List of objects containing one ore more SNMP parameters which can be associated with an SNMP transport target.
        type: list
        elements: dict
        suboptions:
          name:
            description: 'An arbitrary name which uniquely identifies this target-params entry in the list. (Key for list: target-params)'
            type: str
            required: true
          security_name:
            description: SNMP security name, represented as a string.
            type: str
            required: true
          security_level:
            description: The security level associated with this target-params entry. Default is no-auth-no-priv.
            type: str
            required: false
            choices:
            - no-auth-no-priv
            - auth-no-priv
            - auth-priv
          security_model:
            description: The security model associated with this target-params entry. Default is v1.
            type: str
            required: false
            choices:
            - v1
            - v2c
            - usm
        key: name
      user:
        description: List of SNMPv3 user profiles. A double-keyed list that consists of a user name and an Engine Id value. The combination of
          user name and Engine Id make up SNMP MIB user profile.
        type: list
        elements: dict
        suboptions:
          auth_protocol:
            description: The SNMP user authentication protocol.
            type: str
            required: true
            choices:
            - noAuth
            - md5
            - sha
          engine_id:
            description: 'The SNMP user engine id, unique identifier, expressed as a series of colon-separated hexadecimal octets. (Key for list:
              user)'
            type: str
            required: true
          name:
            description: 'SNMP user name. Uniquely identifies the user entry in the list. (Key for list: user)'
            type: str
            required: true
          auth_password:
            description: The user authentication protocol password, supplied as cleartext. This is a write-only attribute that should not be stored
              nor returned on user retrieval. The password will be encrypted via one-way hash function and stored only in its encrypted format.
            type: str
            required: false
          auth_secret:
            description: The encrypted user authentication protocol password string, supplied as a hashed value. This should only be configured
              at user creation time, and will be ignored if the user account already exists.
            type: str
            required: false
          priv_password:
            description: The user privacy protocol password, supplied as cleartext. This is a write-only attribute that should not be stored nor
              returned on user retrieval. The password will be encrypted via one-way hash function and stored only in its encrypted format.
            type: str
            required: false
          priv_protocol:
            description: The SNMP user privacy protocol.
            type: str
            required: false
            choices:
            - noPriv
            - des
            - 3des
            - aes-128
          priv_secret:
            description: The encrypted user privacy protocol password string, supplied as a hashed value. This should only be configured at user
              creation time, and will be ignored if the user account already exists.
            type: str
            required: false
        key: name engine-id
      viewtree:
        description: List of view tree definitions. A double-keyed list that consists of a view tree name and sub-tree OID string value. The combination
          of sub-tree entries with the same viewtree name make up an SNMP MIB Viewtree or View Tree Family.
        type: list
        elements: dict
        suboptions:
          type:
            description: The SNMP Sub-tree type.
            type: str
            required: true
            choices:
            - include
            - exclude
          name:
            description: 'SNMP viewtree name. Identifies the viewtree entries in the list that belong to the same viewtree family. (Key for list:
              viewtree)'
            type: str
            required: true
          sub_tree:
            description: 'SNMP Sub-tree definition, OID format, Ex;1.3.6.1.4.1.1271.35, and predefined system defaults snmpResearch and iso. (Key
              for list: viewtree)'
            type: str
            required: true
          mask:
            description: Sub-tree mask or family mask, a colon-separated octet string.
            type: str
            required: false
        key: name sub-tree
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
