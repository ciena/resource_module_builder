GENERATOR_VERSION: '2.0'
NETWORK_OS: waveserverai
RESOURCE: license
XML_NAMESPACE: urn:ciena:params:xml:ns:yang:ciena-ws:ciena-waveserver-license
XML_ROOT_KEY: waveserver-license
XML_ITEMS: null
XML_ITEMS_KEY: null
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: waveserverai_license
  short_description: Waveserver license information parameters.Manage the license configuration of a Ciena waveserverai device
  description: Waveserver license information parameters.
  author: Ciena
  options:
    config:
      description: Waveserver license information parameters.
      type: dict
      suboptions:
        client:
          description: License client information.
          type: dict
          suboptions:
            id:
              description: License client identification information.
              type: dict
              suboptions:
                registration_id:
                  description: License client registration id
                  type: str
                  required: false
            state:
              description: License client state information.
              type: dict
              suboptions:
                admin_state:
                  description: Administrative state of the license service. Always enabled.
                  type: str
                  required: false
                  choices:
                  - disabled
                  - enabled
        server:
          description: License server information.
          type: dict
          suboptions:
            backup_license_servers:
              description: Backup external license servers.
              type: list
              elements: dict
              suboptions:
                priority:
                  description: 'Priority or identity of the backup license server - 0 is high and 10 is low (Key for list: backup-license-servers)'
                  type: int
                  required: true
                host_address:
                  description: The license server's host name/address and port number, separated by a colon (like 10.45.65.23;7071).
                  type: str
                  required: false
                protocol:
                  description: The protocol type to communicate with the external license server. The default is https.
                  type: str
                  required: false
                  choices:
                  - https
                  - http
              key: priority
            host_address:
              description: The license server host name and port number, separated by a colon.
              type: str
              required: false
            protocol:
              description: The protocol to communicate with the external license server. The default is https.
              type: str
              required: false
              choices:
              - https
              - http
            sync_interval:
              description: Time (in minutes) to sync with the external license server; 15 min is default; Once a day (1440min) max allowed.
              type: int
              required: false
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
