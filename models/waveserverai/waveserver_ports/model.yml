GENERATOR_VERSION: '2.0'
NETWORK_OS: waveserverai
RESOURCE: waveserver-ports
XML_NAMESPACE: urn:ciena:params:xml:ns:yang:ciena-ws:ciena-waveserver-port
XML_ROOT_KEY: waveserver-ports
XML_ITEMS: ports
XML_ITEMS_KEY: port-id
