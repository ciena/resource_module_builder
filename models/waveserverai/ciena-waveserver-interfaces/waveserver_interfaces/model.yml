GENERATOR_VERSION: '2.0'
NETWORK_OS: waveserverai
RESOURCE: waveserver-interfaces
XML_NAMESPACE: urn:ciena:params:xml:ns:yang:ciena-ws:ciena-waveserver-interfaces
XML_ROOT_KEY: waveserver-interfaces
XML_ITEMS: physical-interface
XML_ITEMS_KEY: name
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: waveserverai_waveserver_interfaces
  short_description: Top level container for configuration and operational data for physical and logical network interfaces.Manage the waveserver_interfaces
    physical_interface configuration of a Ciena waveserverai device
  description: "Top level container for configuration and operational data for physical and logical network interfaces.\n List of physical Ethernet\
    \ management interfaces (or interface ports)."
  author: Ciena
  options:
    config:
      description: List of physical Ethernet management interfaces (or interface ports).
      type: list
      elements: dict
      key: name
      suboptions:
        name:
          description: 'References the system-assigned name of the interface. (Key for list: physical-interface)'
          type: str
          required: true
        id:
          description: Identification information of this management interface.
          type: dict
          suboptions:
            name:
              description: The system-assigned name of the physical interface (e.g. ifp0-dcn-1, ifp0-ilan-1, ifp0-1-1, etc.). The names are predefined.
              type: str
              required: false
        properties:
          description: All the configuration data of the physical management interface.
          type: dict
          suboptions: {}
        state:
          description: Physical management interface state information.
          type: dict
          suboptions:
            admin_state:
              description: Whether Admin State is enabled or disabled for this management interface.
              type: str
              required: false
              choices:
              - disabled
              - enabled
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
