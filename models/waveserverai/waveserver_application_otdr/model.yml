GENERATOR_VERSION: '2.0'
NETWORK_OS: waveserverai
RESOURCE: waveserver-application-otdr
XML_NAMESPACE: urn:ciena:params:xml:ns:yang:ciena-ws:ciena-waveserver-application-otdr
XML_ROOT_KEY: waveserver-application-otdr
XML_ITEMS: profile
XML_ITEMS_KEY: profile-id
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: waveserverai_waveserver_application_otdr
  short_description: Optical Time Domain Reflectometer (OTDR) configuration data.Manage the waveserver_application_otdr profile configuration
    of a Ciena waveserverai device
  description: "Optical Time Domain Reflectometer (OTDR) configuration data.\n Configuration data for the OTDR Profiles"
  author: Ciena
  options:
    config:
      description: Configuration data for the OTDR Profiles
      type: list
      elements: dict
      suboptions:
        profile_id:
          description: 'Unique ID of an OTDR Profile; <1..16>, office, short, long. Only profile-ids <2..16> can be created/deleted. (Key for
            list: profile)'
          type: str
          required: true
        description:
          description: A description of the OTDR Profile.
          type: str
          required: false
        distance:
          description: Distance in meters Range <10..128000>
          type: int
          required: false
        measure_time:
          description: Measure time in seconds Range <1..180>
          type: int
          required: false
        pulse_width:
          description: Pulse width in nano-seconds Range <10|30|100|300|1000|3000|10000|20000>
          type: int
          required: false
      key: profile-id
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
