GENERATOR_VERSION: '2.0'
NETWORK_OS: waveserverai
RESOURCE: waveserver-chassis
XML_NAMESPACE: urn:ciena:params:xml:ns:yang:ciena-ws:ciena-waveserver-chassis
XML_ROOT_KEY: waveserver-chassis
XML_ITEMS: null
XML_ITEMS_KEY: null
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: waveserverai_waveserver_chassis__properties
  short_description: Waveserver chassis configuration data and operational data.Manage the waveserver_chassis__properties properties configuration
    of a Ciena waveserverai device
  description: Waveserver chassis configuration data and operational data.
  author: Ciena
  options:
    config:
      access_panel:
        description: Access Panel
        type: dict
        suboptions:
          state:
            description: Access Panel state information.
            type: dict
            suboptions:
              admin_state:
                description: Whether admin state of the Access Panel is enabled or disabled.
                type: str
                required: false
                choices:
                - disabled
                - enabled
      control_module:
        description: Waveserver Control Subsystem. This is the control module for the Waveserver Ai or Waveserver 5 chassis.
        type: dict
        suboptions:
          state:
            description: Control module state information.
            type: dict
            suboptions:
              admin_state:
                description: Whether admin state of the control module is enabled or disabled.
                type: str
                required: false
                choices:
                - disabled
                - enabled
      management_port:
        description: A list to manage chassis ports.
        type: list
        elements: dict
        suboptions:
          port_id:
            description: 'Management port identifier. (Key for list: management-port)'
            type: str
            required: true
            choices:
            - ilan-1
            - ilan-2
            - dcn-1
            - dcn-2
            - dcn-3
            - dcn-4
            - dcn-5
            - console-1
            - console-2
            - dcn
          properties:
            description: All the operational data of this management port.
            type: dict
            suboptions:
              mode:
                description: Management port mode. Specifies whether the port is configured as a local management interface or wayside communications
                  channel (carry through).
                type: str
                required: false
                choices:
                - management
                - wayside-channel
                - redundant-bgp
                - ospf-peering
          state:
            description: Management port state information.
            type: dict
            suboptions:
              admin_state:
                description: Whether Admin State is enabled or disabled for this management port.
                type: str
                required: false
                choices:
                - disabled
                - enabled
        key: port-id
      power_supply_units:
        description: Power Supply Unit Status.
        type: list
        elements: dict
        suboptions:
          psu_id:
            description: 'Unique id for the Power Supply Unit list entry. (Key for list: power-supply-units)'
            type: str
            required: true
          state:
            description: Power Supply Unit state information.
            type: dict
            suboptions:
              admin_state:
                description: Whether admin state of the Power Supply Unit is enabled or disabled. Disabled state masks the alarms only.
                type: str
                required: false
                choices:
                - disabled
                - enabled
        key: psu-id
      slot:
        description: Chassis slot power management.
        type: list
        elements: dict
        suboptions:
          slot_id:
            description: 'Chassis slot number, Key value for the chassis slot list. (Key for list: slot)'
            type: int
            required: true
          power_state:
            description: Slot power state.
            type: str
            required: false
            choices:
            - automatic
            - shutdown
          sub_slot:
            description: Chassis sub-slot power management.
            type: list
            elements: dict
            suboptions:
              sub_slot_id:
                description: 'Chassis sub-slot id, Key value for the chassis sub-slot list. (Key for list: sub-slot)'
                type: str
                required: true
              power_state:
                description: Sub-slot power state.
                type: str
                required: false
                choices:
                - automatic
                - shutdown
            key: sub-slot-id
        key: slot-id
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
