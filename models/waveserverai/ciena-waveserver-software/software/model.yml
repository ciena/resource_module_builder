GENERATOR_VERSION: '2.0'
NETWORK_OS: waveserverai
RESOURCE: software
XML_NAMESPACE: urn:ciena:params:xml:ns:yang:ciena-ws:ciena-waveserver-software
XML_ROOT_KEY: waveserver-software
XML_ITEMS: null
XML_ITEMS_KEY: null
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: waveserverai_software
  short_description: Waveserver software upgrade and load management.Manage the software configuration of a Ciena waveserverai device
  description: Waveserver software upgrade and load management.
  author: Ciena
  options:
    config:
      description: Waveserver software upgrade and load management.
      type: dict
      suboptions:
        network:
          description: Network upgrade status.
          type: dict
          suboptions:
            upgrade:
              description: Network upgrade.
              type: dict
              suboptions:
                auto_member_upgrade:
                  description: Auto-upgrade enabled for network.
                  type: bool
                  required: false
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
