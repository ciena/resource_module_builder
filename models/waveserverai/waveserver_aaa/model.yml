GENERATOR_VERSION: '2.0'
NETWORK_OS: waveserverai
RESOURCE: waveserver-aaa
XML_NAMESPACE: urn:ciena:params:xml:ns:yang:ciena-ws:ciena-waveserver-aaa
XML_ROOT_KEY: waveserver-aaa
XML_ITEMS: user
XML_ITEMS_KEY: user-name
ANSIBLE_METADATA:
  metadata_version: '2.0'
  status:
  - preview
  supported_by: network
COPYRIGHT: Copyright 2025 Ciena
DOCUMENTATION:
  module: waveserverai_waveserver_aaa
  short_description: Waveserver AAA configuration and operational data. Defines authentication, authorization and accounting services.Manage the
    waveserver_aaa user configuration of a Ciena waveserverai device
  description: "Waveserver AAA configuration and operational data. Defines authentication, authorization and accounting services.\n List of local\
    \ user accounts used for local authentication."
  author: Ciena
  options:
    config:
      description: List of local user accounts used for local authentication.
      type: list
      elements: dict
      suboptions:
        access_level:
          description: The access-level or role assigned to the local user.
          type: str
          required: true
          choices:
          - limited
          - admin
          - super
          - diag
        user_name:
          description: 'The configured username for this local user. Must be unique across the list of configured local users. (Key for list:
            user)'
          type: str
          required: true
        password:
          description: The user password, supplied as cleartext. This is a write-only attribute that should not be stored nor returned on user
            retrieval. The password will be encrypted via one-way hash function and stored only in its encrypted format. The hashed password string
            can be retrieved via the 'secret' attribute.
          type: str
          required: false
        secret:
          description: The encrypted user password string, supplied as a hashed value. This should only be configured at user creation time, and
            will be ignored if the user account already exists.
          type: str
          required: false
      key: user-name
    state:
      description:
      - The state of the configuration
      type: str
      choices:
      - merged
      - deleted
      default: merged
EXAMPLES:
- merged_example_01.txt
- deleted_example_01.txt
notes:
- This module requires the netconf system service be enabled on the remote device being managed.
- This module works with connection C(netconf)
requirements:
- ncclient (>=v0.6.4)
