          state:
            description: PM instance state.
            type: dict
            suboptions:
              admin_state:
                description: The configured administrative state of the port.
                type: str
                required: false
                choices:
                - disabled
                - enabled
              tca_admin_state:
                description: The configured TCA administrative state for this PM instance.
                type: str
                required: false
                choices:
                - disabled
                - enabled
        key: instance-name
      global_config:
        description: Performance monitoring global configuration on the Waveserver.
        type: dict
        suboptions:
          admin_state:
            description: Global admin state.
            type: str
            required: false
            choices:
            - disabled
            - enabled
          tca_admin_state:
            description: Global TCA administrative state.
            type: str
            required: false
            choices:
            - disabled
            - enabled
          tca_notification_type:
            description: Global TCA notification type.
            type: str
            required: false
            choices:
            - summary-event
            - summary-alarm
            - event
            - alarm
          untimed_read_and_clear:
            description: Global configuration for clearing untimed bin stats on a get request.
            type: str
            required: false
            choices:
            - disabled
            - enabled
