xml_namespace: urn:ciena:params:xml:ns:yang:ciena-ws:ciena-waveserver-pm
network_os: waveserverai
potential_modules:
  waveserver_pm:
    description: Waveserver performance monitoring configuration and operational data.
    type: dict
    suboptions:
      encryption_gcm_performance_instances:
        description: Channel Encryption-GCM PM instances.
        type: list
        elements: dict
        suboptions:
          instance_name:
            description: 'Unique name for PM instance. (Key for list: encryption-gcm-performance-instances)'
            type: str
            required: true
          properties:
            description: PM instance properties.
            type: dict
            suboptions:
              tca_profile_15_min:
                description: TCA profile name that is attached to the current 15 minute bin
                type: str
                required: false
              tca_profile_24_hr:
                description: TCA profile name that is attached to the current 24 hour bin
                type: str
                required: false
              tca_profile_untimed:
                description: TCA profile name that is attached to the untimed bin
                type: str
                required: false
          state:
            description: PM instance state.
            type: dict
            suboptions:
              admin_state:
                description: The configured administrative state of the port.
                type: str
                required: false
                choices:
                - disabled
                - enabled
              tca_admin_state:
                description: The configured TCA administrative state for this PM instance.
                type: str
                required: false
                choices:
                - disabled
                - enabled
        key: instance-name
      ethernet_performance_instances:
        description: Ethernet port PM instances.
        type: list
        elements: dict
        suboptions:
