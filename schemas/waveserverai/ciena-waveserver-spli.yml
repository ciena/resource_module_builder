xml_namespace: urn:ciena:params:xml:ns:yang:ciena-ws:ciena-waveserver-spli
network_os: waveserverai
potential_modules:
  waveserver_spli:
    description: Waveserver SPLI top level container.
    type: dict
    suboptions:
      global_config:
        description: Waveserver SPLI global configuration and operational data.
        type: dict
        suboptions:
          admin_state:
            description: Specifies whether SPLI is enabled globally at the chassis level.
            type: str
            required: false
            choices:
            - disabled
            - enabled
