xml_namespace: urn:ciena:params:xml:ns:yang:ciena-ws:ciena-waveserver-pm-tca
network_os: waveserverai
potential_modules:
  waveserver_pm_tca:
    description: Waveserver performance monitoring threshold crossing alerts.
    type: dict
    suboptions:
      tca_profiles:
        description: Performance monitoring threshold crossing alerts profiles on the Waveserver.
        type: dict
        suboptions:
          user_created:
            description: User created performance monitoring threshold crossing alerts profiles.
            type: dict
            suboptions:
              encryption_gcm_profiles:
                description: Channel Encryption GCM TCA profiles.
                type: list
                elements: dict
                suboptions:
                  bin_type:
                    description: TCA profile bin type.
                    type: str
                    required: true
                    choices:
                    - 15-min
                    - 24-hr
                    - untimed
                  profile_name:
                    description: 'Unique name for TCA profile. (Key for list: encryption-gcm-profiles)'
                    type: str
                    required: true
                  error_count:
                    description: GCM tag error count threshold.
                    type: int
                    required: false
                  errored_seconds:
                    description: Threshold for the number of seconds that error happened.
                    type: int
                    required: false
                  far_end:
                    description: Far-end Encryption GCM TCA thresholdss.
                    type: dict
                    suboptions:
                      errored_seconds:
                        description: Threshold for the number of seconds that error happened.
                        type: int
                        required: false
                      severely_errored_seconds:
                        description: Threshold for the number of seconds that severe error happened.
                        type: int
                        required: false
                  severely_errored_seconds:
                    description: Threshold for the number of seconds that severe error happened.
                    type: int
                    required: false
                  unavailable_seconds:
                    description: Threshold for the number of seconds that the interface was unavailable.
                    type: int
                    required: false
                key: profile-name
              ethernet_profiles:
                description: Ethernet TCA profiles.
                type: list
                elements: dict
                suboptions:
                  bin_type:
                    description: TCA profile bin type.
                    type: str
                    required: true
                    choices:
                    - 15-min
                    - 24-hr
                    - untimed
                  profile_name:
                    description: 'Unique name for TCA profile. (Key for list: ethernet-profiles)'
                    type: str
                    required: true
                  pcs_layer:
                    description: PCS layer thresholds.
                    type: dict
                    suboptions:
                      errored_seconds:
                        description: Threshold for the number of seconds that error happened.
                        type: int
                        required: false
                      severely_errored_seconds:
                        description: Threshold for the number of seconds that severe error happened.
                        type: int
                        required: false
                      unavailable_seconds:
                        description: Threshold for the number of seconds that the interface was unavailable.
                        type: int
                        required: false
                  rx_crc_errored_packets:
                    description: Threshold for the number of packets received which contained an FCS error and were between 64 and 1518 bytes
                      in length.
                    type: int
                    required: false
                  rx_frame_error_ratio:
                    description: Rx frame error ratio threshold, expressed in scientific notation.
                    type: str
                    required: false
                  rx_link_utilization:
                    description: Rx link utilization threshold as a percentage.
                    type: float
                    required: false
                  tx_crc_errored_packets:
                    description: Threshold for the number of transmitted packets with an FCS error
                    type: int
                    required: false
                  tx_frame_error_ratio:
                    description: Tx frame error ratio threshold, expressed in scientific notation.
                    type: str
                    required: false
                  tx_link_utilization:
                    description: Tx link utilization threshold as a percentage.
                    type: float
                    required: false
                key: profile-name
              modem_profiles:
                description: Modem TCA profiles.
                type: list
                elements: dict
                suboptions:
                  bin_type:
                    description: TCA profile bin type.
                    type: str
                    required: true
                    choices:
                    - 15-min
                    - 24-hr
                    - untimed
                  profile_name:
                    description: 'Unique name for TCA profile. (Key for list: modem-profiles)'
                    type: str
                    required: true
                  cfo:
                    description: Carrier Frequency Offset threshold.
                    type: int
                    required: false
                  chromatic_dispersion:
                    description: Chromatic Dispersion threshold, in picoseconds per nanometer (ps/nm).
                    type: int
                    required: false
                  csi:
                    description: Cycle Slip Indicator (CSI) Threshold.
                    type: int
                    required: false
                  dgd:
                    description: Differential group delay (DGD) threshold, in picoseconds per nanometer (ps/nm).
                    type: float
                    required: false
                  esnr:
                    description: Effective Signal-to-Noise Ratio (ESNR) threshold in dB.
                    type: float
                    required: false
                  esnr_delta:
                    description: Electrical Signal-to-Noise Ratio (ESNR) Delta threshold in dB.
                    type: float
                    required: false
                  evm:
                    description: Error Vector Magnitude threshold.
                    type: float
                    required: false
                  high_correction_count_seconds:
                    description: FEC high correction count seconds threshold.
                    type: int
                    required: false
                  mer:
                    description: Modulation error ratio threshold.
                    type: float
                    required: false
                  osnr:
                    description: Optical Signal-to-Noise Ratio threshold in dB.
                    type: float
                    required: false
                  pdl:
                    description: Polarization dependent loss (PDL) threshold in dB.
                    type: float
                    required: false
                  q_factor:
                    description: Rx FEC Q-Factor threshold, expressed in dBQ notation.
                    type: float
                    required: false
                  snr_ase:
                    description: Signal-to-Noise Ratio (SNR) Amplified Spontaneous Emission (ASE) threshold.
                    type: float
                    required: false
                  snr_external:
                    description: Signal-to-Noise Ratio External threshold in dB.
                    type: float
                    required: false
                  snr_tnle:
                    description: Signal-to-Noise Ratio (SNR) Total Non Linear Noise Estimate (TNLE) threshold.
                    type: float
                    required: false
                  sop_roc:
                    description: State of polarization rate of change threshold.
                    type: float
                    required: false
                  sopmd:
                    description: Second Order Polarization Mode Dispersion Threshold.
                    type: float
                    required: false
                key: profile-name
              odu_profiles:
                description: ODU TCA profiles.
                type: list
                elements: dict
                suboptions:
                  bin_type:
                    description: TCA profile bin type.
                    type: str
                    required: true
                    choices:
                    - 15-min
                    - 24-hr
                    - untimed
                  profile_name:
                    description: 'Unique name for TCA profile. (Key for list: odu-profiles)'
                    type: str
                    required: true
                  background_block_errors:
                    description: Background Block Errors (BBE) threshold.
                    type: int
                    required: false
                  errored_seconds:
                    description: Threshold for the number of seconds that error happened.
                    type: int
                    required: false
                  far_end:
                    description: Far-end OTN port/channel TCA thresholdss.
                    type: dict
                    suboptions:
                      background_block_errors:
                        description: Background Block Errors (BBE) threshold.
                        type: int
                        required: false
                      errored_seconds:
                        description: Threshold for the number of seconds that error happened.
                        type: int
                        required: false
                      severely_errored_seconds:
                        description: Threshold for the number of seconds that severe error happened.
                        type: int
                        required: false
                      unavailable_seconds:
                        description: Threshold for the number of seconds that the interface was unavailable.
                        type: int
                        required: false
                  severely_errored_seconds:
                    description: Threshold for the number of seconds that severe error happened.
                    type: int
                    required: false
                  unavailable_seconds:
                    description: Threshold for the number of seconds that the interface was unavailable.
                    type: int
                    required: false
                key: profile-name
              optical_power_profiles:
                description: Optical power TCA profiles.
                type: list
                elements: dict
                suboptions:
                  bin_type:
                    description: TCA profile bin type.
                    type: str
                    required: true
                    choices:
                    - 15-min
                    - 24-hr
                    - untimed
                  profile_name:
                    description: 'Unique name for TCA profile. (Key for list: optical-power-profiles)'
                    type: str
                    required: true
                  baseline_rx_offset:
                    description: Optical power baseline Rx offset, as a power level in dBm.
                    type: float
                    required: false
                  baseline_tx_offset:
                    description: Optical power baseline Tx offset, as a power level in dBm.
                    type: float
                    required: false
                key: profile-name
              otu_profiles:
                description: OTU TCA profiles.
                type: list
                elements: dict
                suboptions:
                  bin_type:
                    description: TCA profile bin type.
                    type: str
                    required: true
                    choices:
                    - 15-min
                    - 24-hr
                    - untimed
                  profile_name:
                    description: 'Unique name for TCA profile. (Key for list: otu-profiles)'
                    type: str
                    required: true
                  background_block_errors:
                    description: Background Block Errors (BBE) threshold.
                    type: int
                    required: false
                  errored_seconds:
                    description: Threshold for the number of seconds that error happened.
                    type: int
                    required: false
                  far_end:
                    description: Far-end OTN port/channel TCA thresholdss.
                    type: dict
                    suboptions:
                      background_block_errors:
                        description: Background Block Errors (BBE) threshold.
                        type: int
                        required: false
                      errored_seconds:
                        description: Threshold for the number of seconds that error happened.
                        type: int
                        required: false
                      severely_errored_seconds:
                        description: Threshold for the number of seconds that severe error happened.
                        type: int
                        required: false
                      unavailable_seconds:
                        description: Threshold for the number of seconds that the interface was unavailable.
                        type: int
                        required: false
                  severely_errored_seconds:
                    description: Threshold for the number of seconds that severe error happened.
                    type: int
                    required: false
                  unavailable_seconds:
                    description: Threshold for the number of seconds that the interface was unavailable.
                    type: int
                    required: false
                key: profile-name
              photonics_profiles:
                description: Photonics TCA profiles.
                type: list
                elements: dict
                suboptions:
                  bin_type:
                    description: TCA profile bin type.
                    type: str
                    required: true
                    choices:
                    - 15-min
                    - 24-hr
                    - untimed
                  profile_name:
                    description: 'Unique name for TCA profile. (Key for list: photonics-profiles)'
                    type: str
                    required: true
                  return_loss:
                    description: Return Loss offset in dB.
                    type: float
                    required: false
                  rx_otdr_long:
                    description: Rx OTDR long trace thresholds.
                    type: dict
                    suboptions:
                      cumulative_loss:
                        description: Cumulative loss offset in dB.
                        type: float
                        required: false
                      cumulative_reflection:
                        description: Cumulative reflection offset in dB.
                        type: float
                        required: false
                      event_max_loss:
                        description: Event maximum loss offset in dB.
                        type: float
                        required: false
                      event_max_reflection:
                        description: Event maximum reflection offset in dB.
                        type: float
                        required: false
                  rx_otdr_short:
                    description: Rx OTDR short trace thresholds.
                    type: dict
                    suboptions:
                      cumulative_loss:
                        description: Cumulative loss offset in dB.
                        type: float
                        required: false
                      cumulative_reflection:
                        description: Cumulative reflection offset in dB.
                        type: float
                        required: false
                      event_max_loss:
                        description: Event maximum loss offset in dB.
                        type: float
                        required: false
                      event_max_reflection:
                        description: Event maximum reflection offset in dB.
                        type: float
                        required: false
                  rx_span_loss:
                    description: Rx Span Loss offset in dB.
                    type: float
                    required: false
                  tx_otdr_long:
                    description: Tx OTDR long trace thresholds.
                    type: dict
                    suboptions:
                      cumulative_loss:
                        description: Cumulative loss offset in dB.
                        type: float
                        required: false
                      cumulative_reflection:
                        description: Cumulative reflection offset in dB.
                        type: float
                        required: false
                      event_max_loss:
                        description: Event maximum loss offset in dB.
                        type: float
                        required: false
                      event_max_reflection:
                        description: Event maximum reflection offset in dB.
                        type: float
                        required: false
                  tx_otdr_short:
                    description: Tx OTDR short trace thresholds.
                    type: dict
                    suboptions:
                      cumulative_loss:
                        description: Cumulative loss offset in dB.
                        type: float
                        required: false
                      cumulative_reflection:
                        description: Cumulative reflection offset in dB.
                        type: float
                        required: false
                      event_max_loss:
                        description: Event maximum loss offset in dB.
                        type: float
                        required: false
                      event_max_reflection:
                        description: Event maximum reflection offset in dB.
                        type: float
                        required: false
                  tx_span_loss:
                    description: Tx Span Loss offset in dB.
                    type: float
                    required: false
                key: profile-name
