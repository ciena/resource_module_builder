xml_namespace: http://ciena.com/ns/yang/ciena-evpn
network_os: saos10
potential_modules:
  evpn:
    description: Ethernet Virtual Private Network (EVPN)
    type: dict
    suboptions:
      ethernet_segments:
        description: Top level Ethernet Segment (ES) container for Ethernet Segment configurations
        type: dict
        suboptions:
          ethernet_segment:
            description: Top level ES configuration list
            type: list
            elements: dict
            suboptions:
              logical_port:
                description: Logical port of the ES
                type: str
                required: true
              name:
                description: 'Name of the ES (Key for list: ethernet-segment)'
                type: str
                required: true
              active_mode:
                description: Choice of active mode with a default single-active-mode. By default, the mode is set to single-active-mode.
                type: str
                required: false
                choices:
                - single-active-mode
                - all-active-mode
              df_election:
                description: Designated Forwarder (DF) election
                type: dict
                suboptions:
                  df_election_method:
                    description: The DF election method. By default, the method is set to default.
                    type: str
                    required: false
                    choices:
                    - default
                    - highest-random-weight
                    - preference
                  election_wait_time:
                    description: Wait time in seconds for DF election <3..max>. By default, the value is set to 3.
                    type: int
                    required: false
                  preference:
                    description: The DF preference value. By default, the value is set to 32767.
                    type: int
                    required: false
                  reversion_hold_time:
                    description: Duration in seconds before reversion <3..max>. By default, the value is set to 3.
                    type: int
                    required: false
                  revertive:
                    description: The 'preempt' or 'revertive' behavior. By default, the value is set to true.
                    type: bool
                    required: false
                  select_high_preference:
                    description: Preference with higher value will be selected first. By default, the value is set to true.
                    type: bool
                    required: false
              es_import:
                description: No description available
                type: dict
                suboptions:
                  route_distinguisher:
                    description: Route Distinguisher (8-octet) value used to distinguish routes from different VPNs
                    type: str
                    required: false
                  route_target:
                    description: Route Target (8-octet) value used when importing routes into forwarding tables
                    type: str
                    required: false
              ethernet_segment_identifier:
                description: 10-octet Ethernet Segment Identifier (ESI) used to identify an Ethernet Segment
                type: dict
                suboptions:
                  arbitrary:
                    description: ESI that is managed and configured by user
                    type: dict
                    suboptions:
                      arbitrary:
                        description: Arbitrary value (9-octet)
                        type: str
                        required: false
                  as_based:
                    description: Autonomous System (AS) based – can be auto-generated/configured. AS number (4 octets) + local discriminator (4
                      octets) + 0x00 (1 octet)
                    type: dict
                    suboptions:
                      local_discriminator:
                        description: Local discriminator (4 octets)
                        type: int
                        required: true
                      auto_derived:
                        description: Set to 'true' for auto-derived ESI. Set to 'false' for user configuration.
                        type: bool
                        required: false
                      router_id:
                        description: AS number (4 octets)
                        type: int
                        required: false
                  lacp_based:
                    description: Auto-generated ESI value determined from LACP. MAC address (6 octets) + port key (2 octets) + 0x00 (1 octet)
                    type: dict
                    suboptions:
                      auto_derived:
                        description: Set to 'true' for auto-derived ESI.
                        type: str
                        required: false
                        choices:
                        - 'true'
                  lan_based:
                    description: Auto-generated if CE-PE connected via bridged forwarding-domain. Root bridge MAC (6 octets) + priority (2 octets)
                      + 0x00 (1 octet)
                    type: dict
                    suboptions:
                      auto_derived:
                        description: Set to 'true' for auto-derived ESI.
                        type: str
                        required: false
                        choices:
                        - 'true'
                  mac_based:
                    description: MAC based ESI – can be auto-generated/configured. System MAC (6 octets) + Local discriminator (3 octets)
                    type: dict
                    suboptions:
                      local_discriminator:
                        description: Local discriminator (3 octets)
                        type: int
                        required: true
                      system_mac_address:
                        description: ESI System MAC (6 octets)
                        type: str
                        required: true
                      auto_derived:
                        description: Set to 'true' for auto-derived ESI. Set to 'false' for user configuration.
                        type: bool
                        required: false
                  router_id_based:
                    description: Router-ID based ESI – can be auto-generated/configured. Router ID (4 octets) + Local discriminator (4 octets)
                      + 0x00 (1 octet)
                    type: dict
                    suboptions:
                      local_discriminator:
                        description: Local discriminator (4 octets)
                        type: int
                        required: true
                      auto_derived:
                        description: Set to 'true' for auto-derived ESI. Set to 'false' for user configuration.
                        type: bool
                        required: false
                      router_id:
                        description: Router ID (4 octets)
                        type: str
                        required: false
              evlag:
                description: Enable/disable EvLag on the AGG port. By default, the value is set to false/disable.
                type: bool
                required: false
            key: name
      evpn_instances:
        description: Top level EVPN instance container for EVPN instance configurations
        type: dict
        suboptions:
          evpn_instance:
            description: Top level EVPN instance configuration list
            type: list
            elements: dict
            suboptions:
              id:
                description: 'ID of EVPN instance <1..65536> (Key for list: evpn-instance)'
                type: int
                required: true
              flexible_cross_connect_vlan_aware_fd:
                description: Vlan-aware EVPN-FXC service
                type: list
                elements: dict
                suboptions:
                  forwarding_domain:
                    description: 'Name of the forwarding domain (Key for list: flexible-cross-connect-vlan-aware-fd)'
                    type: str
                    required: true
                  control_word:
                    description: The attribute enables or disables the control-word. By default, the value is true.
                    type: bool
                    required: false
                  l2mtu:
                    description: This attribute sets the Layer 2 Maximum Transmission Unit(MTU) <64..65536>. By default, the value is set to 1500.
                    type: int
                    required: false
                  stats_collection:
                    description: Evpn Statistic Collection. By default, the value is set to disable.
                    type: str
                    required: false
                    choices:
                    - enable
                    - disable
                key: forwarding-domain
              flexible_cross_connect_vlan_unaware_fd:
                description: Vlan-unaware EVPN-FXC service
                type: list
                elements: dict
                suboptions:
                  forwarding_domain:
                    description: 'Name of the forwarding domain (Key for list: flexible-cross-connect-vlan-unaware-fd)'
                    type: str
                    required: true
                  local_service_id:
                    description: Service ID of locally connected CE <1..16777216>
                    type: int
                    required: true
                  control_word:
                    description: The attribute enables or disables the control-word. By default, the value is true.
                    type: bool
                    required: false
                  l2mtu:
                    description: This attribute sets the Layer 2 Maximum Transmission Unit(MTU) <64..65536>. By default, the value is set to 1500.
                    type: int
                    required: false
                  remote_service_id:
                    description: Service ID of remote CE or host behind remote CE <1..16777216>
                    type: int
                    required: false
                key: forwarding-domain
              route_distinguisher:
                description: A route distinguisher is an 8-octet value used to distinguish routes from different BGP VPNs (RFC 4364). A route
                  distinguisher consists of three fields; A 2-octet type field, an administrator field, and an assigned number field. According
                  to the data formats for type 0, 1, and 2 defined in RFC4364, the encoding pattern is defined as; 0;2-octet-asn;4-octet-number
                  1;4-octet-ipv4addr;2-octet-number 2;4-octet-asn;2-octet-number. 2-octet-other-hex-number;6-octet-hex-number Some valid examples
                  are; 100;100, 1.1.1.1;100, and 1234567890;203
                type: dict
                suboptions:
                  asn_2_octet_based:
                    description: No description available
                    type: dict
                    suboptions:
                      value:
                        description: 2-octet-asn;4-octet-number Route Distinguisher. ex; 100;100
                        type: str
                        required: false
                  asn_4_octet_based:
                    description: No description available
                    type: dict
                    suboptions:
                      value:
                        description: 4-octet-asn;2-octet-number Route Distinguisher. ex; 1234567890;203
                        type: str
                        required: false
                  ip_based:
                    description: No description available
                    type: dict
                    suboptions:
                      value:
                        description: 4-octet-ipv4addr;2-octet-number Route Distinguisher. ex; 1.1.1.1;100
                        type: str
                        required: false
              sr_policy:
                description: No description available
                type: dict
                suboptions:
                  color:
                    description: Color associated with the SR policy
                    type: int
                    required: false
                  fallback:
                    description: Fallback enable is used when the SR policy is down. The service will still continue to be UP, but will fall back
                      to labeled IGP shortest path. By default, the value is set to enable.
                    type: str
                    required: false
                    choices:
                    - enable
                    - disable
              vpls_fd:
                description: EVPN-VPLS service
                type: list
                elements: dict
                suboptions:
                  forwarding_domain:
                    description: 'Name of the forwarding domain (Key for list: vpls-fd)'
                    type: str
                    required: true
                  implicit_import:
                    description: Import EVPN Route type 2 to global route table. Route Next Hop changed to the BGP peer loopback from the update
                      message.
                    type: str
                    required: false
                    choices:
                    - disable
                    - enable
                  irb_mode:
                    description: Integrated routing and bridging mode to forward both bridged or routed traffic.
                    type: str
                    required: false
                    choices:
                    - symmetrical
                    - asymmetrical
                key: forwarding-domain
              vpn_target:
                description: List of Route Targets.
                type: list
                elements: dict
                suboptions:
                  route_target:
                    description: 'Route Target value (Key for list: vpn-target)'
                    type: str
                    required: true
                  route_target_type:
                    description: Import/export type of the Route Target.
                    type: str
                    required: true
                    choices:
                    - import
                    - export
                    - both
                key: route-target
              vpws_cross_connect_fd:
                description: EVPN-VPWS service
                type: list
                elements: dict
                suboptions:
                  forwarding_domain:
                    description: 'Name of the forwarding domain (Key for list: vpws-cross-connect-fd)'
                    type: str
                    required: true
                  local_service_id:
                    description: Service ID of locally connected CE <1..16777216>
                    type: int
                    required: true
                  control_word:
                    description: The attribute enables or disables the control-word. By default, the value is true.
                    type: bool
                    required: false
                  l2mtu:
                    description: This attribute sets the Layer 2 Maximum Transmission Unit(MTU) <64..65536>. By default, the value is set to 1500.
                    type: int
                    required: false
                  remote_service_id:
                    description: Service ID of remote CE or host behind remote CE <1..16777216>
                    type: int
                    required: false
                  stats_collection:
                    description: Evpn Statistic Collection. By default, the value is set to disable.
                    type: str
                    required: false
                    choices:
                    - enable
                    - disable
                key: forwarding-domain
            key: id
      global_route_distinguisher:
        description: Default Global Route Distinguisher
        type: dict
        suboptions:
          route_distinguisher:
            description: Global Route Distinguisher used to distinguish routes from different VPNs
            type: str
            required: false
