xml_namespace: http://ciena.com/ns/yang/ciena-sr
network_os: saos10
potential_modules:
  segment_routing:
    description: Segment routing global config
    type: dict
    suboptions:
      bindings:
        description: List of bindings
        type: dict
        suboptions:
          mapping_server:
            description: Configuration of mapping-server local entries
            type: dict
            suboptions:
              policy:
                description: List mapping-server policies
                type: list
                elements: dict
                suboptions:
                  name:
                    description: 'Name of the mapping policy (Key for list: policy)'
                    type: str
                    required: true
                  entries:
                    description: IPv4/IPv6 mapping entries
                    type: dict
                    suboptions:
                      mapping_entry:
                        description: Mapping entries
                        type: list
                        elements: dict
                        suboptions:
                          algorithm:
                            description: 'Prefix-sid algorithm. (Key for list: mapping-entry)'
                            type: str
                            required: true
                            choices:
                            - prefix-sid-algorithm-strict-spf
                            - prefix-sid-algorithm-shortest-path
                            - prefix-sid-algorithm
                          prefix:
                            description: 'connected prefix sid. (Key for list: mapping-entry)'
                            type: str
                            required: true
                          start_sid:
                            description: Value associated with prefix. The value must be interpreted in the context of value-type.
                            type: int
                            required: true
                          attached:
                            description: Indicates that the prefixes and SID configured in the mapping entry and as a result advertised in the
                              SID/Label Binding TLV are directly connected to their originators
                            type: bool
                            required: false
                          range:
                            description: Describes how many SIDs could be allocated.
                            type: int
                            required: false
                          value_type:
                            description: This leaf defines how value must be interpreted.
                            type: str
                            required: false
                            choices:
                            - index
                            - absolute
                        key: prefix algorithm
                  preference:
                    description: SRMS Preference sub-tlv is used in order to associate a preference with SRMS advertisements from a particular
                      source
                    type: int
                    required: false
                key: name
      connected_prefix_sid_map:
        description: List of prefix SID mapped to IPv4 local prefixes
        type: list
        elements: dict
        suboptions:
          prefix:
            description: 'connected prefix sid. (Key for list: connected-prefix-sid-map)'
            type: str
            required: true
          start_sid:
            description: Value associated with prefix. The value must be interpreted in the context of value-type.
            type: int
            required: true
          algorithm:
            description: Prefix-sid algorithm.
            type: str
            required: false
            choices:
            - prefix-sid-algorithm-strict-spf
            - prefix-sid-algorithm-shortest-path
            - prefix-sid-algorithm
          flex_algorithm:
            description: A numeric identifier in the range 128-255 that is associated via configuration with the flexible algorithm
            type: int
            required: false
          interface:
            description: Interface in which prefix-sid is configured
            type: str
            required: false
          last_hop_behavior:
            description: Configure last hop behavior.
            type: str
            required: false
            choices:
            - explicit-null
            - no-php
            - php
          n_flag:
            description: Node SID flag settings
            type: str
            required: false
            choices:
            - enable
            - disable
          range:
            description: Describes how many SIDs could be allocated.
            type: int
            required: false
          value_type:
            description: This leaf defines how value must be interpreted.
            type: str
            required: false
            choices:
            - index
            - absolute
        key: prefix
      flex_algorithm:
        description: Top level Flexible-Algorithm configuration list
        type: list
        elements: dict
        suboptions:
          algorithm:
            description: 'A numeric identifier in the range 128-255 that is associated via configuration with the Flexible-Algorithm (Key for
              list: flex-algorithm)'
            type: int
            required: true
          admin_group:
            description: Colors to include or exclude during Flex-Algorithm path computation
            type: dict
            suboptions:
              exclude_any:
                description: None of the colors should be set on the link, else the link will be excluded from the path computation
                type: list
                elements: str
              include_all:
                description: All colors must be set on the link, else the link will be excluded from the path computation
                type: list
                elements: str
              include_any:
                description: At least one color must be set on the link, else the link will be excluded from the path computation
                type: list
                elements: str
          advertise_definition:
            description: Flex-Algorithm definition advertisement scope
            type: dict
            suboptions:
              priority:
                description: Value between 0 and 255 inclusive that specifies the priority of the advertisement
                type: int
                required: false
          flex_algo_metric:
            description: Types of metric to be used during the calculation, default is IGP
            type: str
            required: false
            choices:
            - te
            - igp
            - latency
          srlg_exclude:
            description: Shared Risk Link Groups that the operator wants to exclude during the Flex-Algorithm path computation
            type: list
            elements: int
        key: algorithm
      msd:
        description: MSD configuration
        type: dict
        suboptions:
          node_msd:
            description: Node MSD is the lowest MSD supported by the node
            type: int
            required: false
      srgb:
        description: List of global blocks to be advertised
        type: list
        elements: dict
        suboptions:
          lower_bound:
            description: 'Lower value in the block (Key for list: srgb)'
            type: int
            required: true
          upper_bound:
            description: 'Upper value in the block (Key for list: srgb)'
            type: int
            required: true
        key: lower-bound upper-bound
      srv6:
        description: No description available
        type: dict
        suboptions:
          locators:
            description: SRv6 locators
            type: dict
            suboptions:
              locator:
                description: Configure a SRv6 locator
                type: list
                elements: dict
                suboptions:
                  name:
                    description: 'Representation of the most significant bits of the address (Key for list: locator)'
                    type: str
                    required: true
                  prefix:
                    description: Locator IPv6 prefix
                    type: str
                    required: true
                  algorithm:
                    description: A numeric identifier in the range 128-255 that is associated via configuration with the flexible algorithm (future)
                    type: int
                    required: false
                  block_length:
                    description: Length of locator block (future)
                    type: int
                    required: false
                  end_behavior_type:
                    description: Type of SRV6 end behavior
                    type: str
                    required: false
                    choices:
                    - End.PSP_USD
                    - End_NEXT_CSID_PSP_USD
                  function_length:
                    description: Length of the function (future)
                    type: int
                    required: false
                  node_length:
                    description: Length of locator node (future)
                    type: int
                    required: false
                  sid_type:
                    description: SR SID type as u-sid or uncompressed-sid
                    type: str
                    required: false
                    choices:
                    - uncompressed-sid
                    - u-sid
                key: name
          rib_update_delay:
            description: Set route download delay for microloop prevention
            type: int
            required: false
          ti_lfa:
            description: Enables/disables topology independent FRR
            type: bool
            required: false
