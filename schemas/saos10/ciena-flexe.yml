xml_namespace: http://www.ciena.com/ns/yang/ciena-flexe
network_os: saos10
potential_modules:
  flexe_bas_oams:
    description: FlexE BAS (basic code block) OAM configurations
    type: dict
    suboptions:
      flexe_bas_oam:
        description: List of FlexE BAS (basic code block) OAMs.
        type: list
        elements: dict
        suboptions:
          name:
            description: 'Name for a FlexE BAS (basic code block) OAM. (Key for list: flexe-bas-oam)'
            type: str
            required: true
          tx_enable:
            description: Enable transmission.
            type: bool
            required: false
          tx_period:
            description: Transmission period.
            type: str
            required: false
            choices:
            - 16K
            - 32K
            - 64K
            - 512K
        key: name
  flexe_channels:
    description: FlexE channel configurations
    type: dict
    suboptions:
      flexe_channel:
        description: List of FlexE channels.
        type: list
        elements: dict
        suboptions:
          channel_number:
            description: Channel number associated to the FlexE channel.
            type: int
            required: true
          group_name:
            description: Name of FlexE group to which this FlexE channel will be associated to.
            type: str
            required: true
          name:
            description: 'Name for FlexE channel. (Key for list: flexe-channel)'
            type: str
            required: true
          bas_oam:
            description: BAS (basic code block) OAM related to FlexE channel.
            type: str
            required: false
          calendar_A_slots_list:
            description: List of slots allocated on Calendar A for a FlexE channel. Number of slots allocated for a FlexE channel is based on
              the bandwidth allocated for it. Ex; For a system with calendar slot granularity of 5G, a 10G FlexE channel would be allocated 2
              slots (10G/5G)
            type: list
            elements: dict
            suboptions:
              phy_number_in_group:
                description: 'PHY number index from the list of PHYs associated to the FlexE group. Refer to the clause 6.1 in FlexE IA 2.1. For
                  100GBASE-R, the FlexE PHY num and the 100G FlexE instance num are the same and in the range [1-254]; For 200GBASE-R, each PHY
                  num is in the range [1-126]. For 400GBASE-R, each PHY num is in the range [1-62]. For 50GBASE-R, each PHY num is in the range
                  [1-126]. (Key for list: calendar-A-slots-list)'
                type: str
                required: true
              slot_id:
                description: 'Slot number within the list of slots associated to the PHY. Ex; For 100G PHY range is [1..20] For 200G PHY range
                  is [1..40] For 400G PHY range is [1..80] (Key for list: calendar-A-slots-list)'
                type: int
                required: true
            key: phy-number-in-group slot-id
          calendar_B_slots_list:
            description: List of slots allocated on Calendar B for a FlexE channel. Number of slots allocated for a FlexE channel is based on
              the bandwidth allocated for it. Ex; For a system with calendar slot granularity of 5G, a 10G FlexE-channel would be allocated 2
              slots (10G/5G)
            type: list
            elements: dict
            suboptions:
              phy_number_in_group:
                description: 'PHY number index from the list of PHYs associated to the FlexE group. Refer to the clause 6.1 in FlexE IA 2.1. For
                  100GBASE-R, the FlexE PHY num and the 100G FlexE instance num are the same and in the range [1-254]; For 200GBASE-R, each PHY
                  num is in the range [1-126]. For 400GBASE-R, each PHY num is in the range [1-62]. For 50GBASE-R, each PHY num is in the range
                  [1-126]. (Key for list: calendar-B-slots-list)'
                type: str
                required: true
              slot_id:
                description: 'Slot number within the list of slots associated to the PHY. Ex; For 100G PHY range is [1..20] For 200G PHY range
                  is [1..40] For 400G PHY range is [1..80] (Key for list: calendar-B-slots-list)'
                type: int
                required: true
            key: phy-number-in-group slot-id
          channel_mapping:
            description: FlexE Datapath, traffic mapped at L1/L2/L3
            type: str
            required: false
            choices:
            - L1-mapped
            - L2-mapped
          oam_bypass_enable:
            description: Enable OAM bypass.
            type: bool
            required: false
        key: name
  flexe_cross_connects:
    description: FlexE cross connect configurations
    type: dict
    suboptions:
      flexe_cross_connect:
        description: List of FlexE cross-connects. FlexE cross-connect can be between Faceplate standard ethernet ETTP and FlexE MAC ETTP or two
          FlexE channels
        type: list
        elements: dict
        suboptions:
          name:
            description: 'Name for FlexE cross-connect. (Key for list: flexe-cross-connect)'
            type: str
            required: true
          ettp_end_point_a:
            description: ETTP endpoint.
            type: str
            required: false
          ettp_end_point_b:
            description: ETTP endpoint.
            type: str
            required: false
          flexe_channel_end_point_a:
            description: FlexE channel endpoint.
            type: str
            required: false
          flexe_channel_end_point_b:
            description: FlexE channel endpoint.
            type: str
            required: false
          protection_group_end_point_a:
            description: FlexE protection group endpoint.
            type: str
            required: false
          protection_group_end_point_b:
            description: FlexE protection group endpoint.
            type: str
            required: false
        key: name
  flexe_groups:
    description: FlexE group configurations
    type: dict
    suboptions:
      flexe_group:
        description: List of FlexE groups.
        type: list
        elements: dict
        suboptions:
          group_number:
            description: FlexE group number associated to the FlexE group
            type: int
            required: true
          name:
            description: 'Name for FlexE group. (Key for list: flexe-group)'
            type: str
            required: true
          phy_type:
            description: Type of PHY used in the FlexE group, such as 50/100/200/400GBASE-R. All PHYs in a FlexE group should be of same type
            type: str
            required: true
            choices:
            - flexe-phy-50GBASE-R
            - flexe-phy-100GBASE-R
            - flexe-phy-200GBASE-R
            - flexe-phy-400GBASE-R
          admin_state:
            description: Overall FlexE group admin state.
            type: str
            required: false
            choices:
            - disabled
            - enabled
          calendar:
            description: Calendar configuration used in FlexE Mux/Demux
            type: str
            required: false
            choices:
            - calendar-A
            - calendar-B
          calendar_protocol_enable:
            description: Whether calendar negotiation protocol is enabled or not.
            type: bool
            required: false
          calendar_slot_granularity:
            description: The granularity of calendar slot is 5G or 25G
            type: str
            required: false
            choices:
            - slot-5G
            - slot-25G
          flexe_phys:
            description: List of the participating PHYs in a FlexE group
            type: list
            elements: dict
            suboptions:
              local_interface:
                description: Local FlexE port interface related to the current phy-number in a FlexE group.
                type: str
                required: true
              phy_number_in_group:
                description: 'Refer to the clause 6.1 in FlexE IA 2.1. For 100GBASE-R, the FlexE PHY num and the 100G FlexE instance num are the
                  same and in the range [1-254]; For 200GBASE-R, each PHY num is in the range [1-126]. For 400GBASE-R, each PHY num is in the
                  range [1-62]. For 50GBASE-R, each PHY num is in the range [1-126]. PHY num configured in list of flexe-phys should be in ascending
                  order. (Key for list: flexe-phys)'
                type: int
                required: true
            key: phy-number-in-group
          sc_bit_enable:
            description: When this field is set true, the FlexE SC bit is set to 1, otherwise the FlexeE SC bit is 0.
            type: bool
            required: false
        key: name
  flexe_ports:
    description: FlexE port configurations
    type: dict
    suboptions:
      flexe_port:
        description: List of FlexE ports.
        type: list
        elements: dict
        suboptions:
          name:
            description: 'Name for FlexE port. (Key for list: flexe-port)'
            type: str
            required: true
          port_speed:
            description: FlexE port speed.
            type: str
            required: true
            choices:
            - 50Gb
            - 100Gb
            - 200Gb
            - 400Gb
          ptp_id:
            description: Unique, access identifier string of the PTP (e.g., '1/1').
            type: str
            required: true
          admin_state:
            description: Overall port admin state.
            type: str
            required: false
            choices:
            - disabled
            - enabled
          forward_error_correction:
            description: Forward error correction
            type: str
            required: false
            choices:
            - auto
            - disabled
            - enabled
        key: name
  flexe_protection_groups:
    description: FlexE protection groups configurations
    type: dict
    suboptions:
      flexe_protection_group:
        description: List of FlexE protection groups.
        type: list
        elements: dict
        suboptions:
          name:
            description: 'Name for a FlexE protection group. (Key for list: flexe-protection-group)'
            type: str
            required: true
          protection_channel:
            description: Configuration of protection channel on this FlexE Protection group.
            type: str
            required: true
          protection_profile:
            description: Configuration of FlexE Protection Profile on this FlexE Protection group.
            type: str
            required: true
          working_channel:
            description: Configuration of working channel on this FlexE Protection group.
            type: str
            required: true
        key: name
  flexe_protection_profiles:
    description: FlexE Protection Profile configurations
    type: dict
    suboptions:
      flexe_protection_profile:
        description: List of FlexE Protection Profiles.
        type: list
        elements: dict
        suboptions:
          name:
            description: 'Name for a FlexE Protection Profile. (Key for list: flexe-protection-profile)'
            type: str
            required: true
          guard_timer:
            description: Time to pause before resuming processing incoming frames after a switching action on this FlexE Protection group.
            type: int
            required: false
          hold_off_timer:
            description: Time to delay before beginning a protection switching action on this FlexE Protection group.
            type: int
            required: false
          protection_mode:
            description: Configuration of protection mode of this FlexE Protection group.
            type: str
            required: false
            choices:
            - 1-plus-1-unidirectional
            - 1-plus-1-bidirectional
            - 1-to-1
            - 1-to-n
          reversion_mode:
            description: Configuration of reversion capabilities of this FlexE Protection group.
            type: str
            required: false
            choices:
            - revertive
            - non-revertive
        key: name
