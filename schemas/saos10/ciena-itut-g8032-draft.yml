xml_namespace: http://www.ciena.com/ns/yang/ciena-itut-g8032-draft
network_os: saos10
properties:
  g8032_rings:
    description: Contains all the G.8032 system specific related configuration.
    type: dict
    suboptions:
      g8032_ring:
        description: Provides configuration nodes in support of ERP instances on the device.
        type: list
        elements: dict
        suboptions:
          ring_name:
            description: 'G.8032 ring name. (Key for list: g8032-ring)'
            type: str
            required: true
          erp_instances:
            description: Collection of ring instances.
            type: dict
            suboptions:
              erp_instance:
                description: There can be multiple ERP instances associated with a given G.8032 ring. Each ERP instance must have a separate set
                  of data member VLAN identifiers.
                type: list
                elements: dict
                suboptions:
                  erp_instance_construct:
                    description: Type of ERP instance.
                    type: str
                    required: true
                    choices:
                    - sub-ring-no-virtual-channel
                    - sub-ring-virtual-channel
                    - erp-instance-type
                    - major-ring
                  instance_name:
                    description: 'The ERP instance name. (Key for list: erp-instance)'
                    type: str
                    required: true
                  raps_level:
                    description: The Maintenance Entity Level used by the ERP instance for ring APS control messages.
                    type: int
                    required: true
                  raps_vid:
                    description: The VLAN identifier used by the ERP instance for ring APS control messages.
                    type: int
                    required: true
                  data_members:
                    description: The range of data member identifiers protected by the ERP instance.
                    type: list
                    elements: str
                  flush_propagation:
                    description: Indicates the state of flush-propagation for the ring.
                    type: str
                    required: false
                    choices:
                    - 'off'
                    - 'on'
                  guard_timer:
                    description: The guard timer is used to prevent Ethernet ring nodes from acting upon outdated R-APS messages and prevents
                      the possibility of forming a closed loop.
                    type: int
                    required: false
                  hold_off_time:
                    description: The hold-off timer is used to coordinate the timing of protection switches.
                    type: int
                    required: false
                  instance_description:
                    description: Textual description of the instance.
                    type: str
                    required: false
                  ports:
                    description: Port specific configurations for ring instances.
                    type: dict
                    suboptions:
                      port:
                        description: List of the ring ports. If this is a major ring, or this node is in a sub-ring but is not the interconnection
                          node where the sub-ring terminates, then this list must have 2 entries. If this is a sub-ring (with or without a virtual
                          channel), and this is an interconnection node where the sub-ring terminates, then this list must have only 1 entry.
                        type: list
                        elements: dict
                        suboptions:
                          port_id:
                            description: 'Port id of the ring instance. This leaf identifies one of the two ring ports. (Key for list: port)'
                            type: str
                            required: true
                          rpl:
                            description: RPL port role for the ring instance.
                            type: str
                            required: false
                            choices:
                            - none
                            - owner
                            - neighbor
                            - next-neighbor
                        key: port-id
                  raps_priority:
                    description: The priority assigned to the R-APS PDUs.
                    type: int
                    required: false
                  reversion:
                    description: Configuration node specifying the reversion capabilities of this ERP instance.
                    type: str
                    required: false
                    choices:
                    - revertive
                    - non-revertive
                  wtr_timer:
                    description: The wait-to-restore timer associated with the ERP instance.
                    type: int
                    required: false
                key: instance-name
          ring_description:
            description: Textual description of the ring.
            type: str
            required: false
          ring_id:
            description: The Ring ID.
            type: int
            required: false
          ring_ports:
            description: Ring port configurations.
            type: dict
            suboptions:
              ring_port:
                description: List of the ring ports. If all of the ERP instances for this ring are sub-rings that terminate at this node, this
                  list may have only 1 entry.
                type: list
                elements: dict
                suboptions:
                  interface:
                    description: Port interface reference of the Ring.
                    type: str
                    required: true
                  port_id:
                    description: 'Port identifier (port0 or port1). (Key for list: ring-port)'
                    type: str
                    required: true
                    choices:
                    - port0
                    - port1
                  cfm_instance:
                    description: Represents a cfm MEP that can be used to detect signal failure on a ring port. It is a metric used for ring protection
                      switching.
                    type: dict
                    suboptions:
                      maintenance_association:
                        description: A reference to a specific Maintenance Association.
                        type: str
                        required: false
                      maintenance_association_end_point:
                        description: A reference to a specific Maintenance association End Point.
                        type: str
                        required: false
                      maintenance_domain:
                        description: A reference to a specific Maintenance Domain.
                        type: str
                        required: false
                key: port-id
        key: ring-name
      notification_enabled:
        description: Enable/disable ring status change notification. If true, any change in ring state will be notified via ring-state-change
          notification.
        type: bool
        required: false
      raps_version:
        description: The version of the ERP R-APS protocol being used.
        type: str
        required: false
        choices:
        - g8032-version2
        - g8032-version1
        - g8032-version-type
      ring_system_control:
        description: Setting this control allows the enablement or disablement of the G.8032 protection switching on a system wide basis.
        type: str
        required: false
        choices:
        - disabled
        - enabled
