xml_namespace: http://www.ciena.com/ns/yang/ciena-platform
network_os: saos10
potential_modules:
  component_post:
    description: POST related system variables
    type: dict
    suboptions:
      components:
        description: Enclosing container for all components
        type: dict
        suboptions:
          component:
            description: List of POST components
            type: list
            elements: dict
            suboptions:
              name:
                description: 'Name of the POST component (Key for list: component)'
                type: str
                required: true
                choices:
                - macsec
              enforce_now:
                description: Enforcing action immediately with the current test status
                type: list
                required: false
                elements: str
                choices:
                - 'null'
              failure_action:
                description: Action to be taken when the test fails
                type: str
                required: false
                choices:
                - none
                - system-reboot
            key: name
