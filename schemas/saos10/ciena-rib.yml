xml_namespace: http://ciena.com/ns/yang/ciena/ciena-rib
network_os: saos10
potential_modules:
  rib:
    description: IP routing table
    type: dict
    suboptions:
      protocol:
        description: IP RIB protocol options.
        type: dict
        suboptions:
          purge:
            description: Purge routes options.
            type: dict
            suboptions:
              interface:
                description: When true, protocols will remove unreachable routes when dependent interface is down.
                type: bool
                required: false
      vrf:
        description: VRF routing instance
        type: list
        elements: dict
        suboptions:
          name:
            description: 'Virtual Routing and Forwarding instance (Key for list: vrf)'
            type: str
            required: true
          ipv4:
            description: Ipv4 routes
            type: list
            elements: dict
            suboptions:
              destination_prefix:
                description: 'IPv4 destination prefix (Key for list: ipv4)'
                type: str
                required: true
              next_hop:
                description: IPv4 address of the next hop
                type: list
                elements: dict
                suboptions:
                  address:
                    description: 'IPv4 address or blackhole config for the next hop. (Key for list: next-hop)'
                    type: str
                    required: true
                  description:
                    description: Description of the route
                    type: str
                    required: false
                  outgoing_interface_name:
                    description: Name of the outgoing interface
                    type: str
                    required: false
                  route_preference:
                    description: Numerical value that allows for comparing routes from different protocols. Also known as administrative-distance.
                    type: int
                    required: false
                  tag:
                    description: Route tag
                    type: int
                    required: false
                key: address
              outgoing_interface:
                description: Name of the outgoing interface
                type: list
                elements: dict
                suboptions:
                  name:
                    description: 'Name of the outgoing interface (Key for list: outgoing-interface)'
                    type: str
                    required: true
                  description:
                    description: Description of the route
                    type: str
                    required: false
                  route_preference:
                    description: Numerical value that allows for comparing routes from different protocols. Also known as administrative-distance.
                    type: int
                    required: false
                  tag:
                    description: Route tag
                    type: int
                    required: false
                key: name
            key: destination-prefix
          ipv6:
            description: Ipv6 routes
            type: list
            elements: dict
            suboptions:
              destination_prefix:
                description: 'IPv6 destination prefix. (Key for list: ipv6)'
                type: str
                required: true
              next_hop:
                description: IPv6 address of the next hop
                type: list
                elements: dict
                suboptions:
                  address:
                    description: 'IPv6 address of the next hop (Key for list: next-hop)'
                    type: str
                    required: true
                  outgoing_interface_name:
                    description: Name of the outgoing interface
                    type: str
                    required: false
                  route_preference:
                    description: Numerical value that allows for comparing routes from different protocols. Also known as administrative-distance.
                    type: int
                    required: false
                key: address
              outgoing_interface:
                description: List of the outgoing interfaces
                type: list
                elements: dict
                suboptions:
                  name:
                    description: 'Name of the outgoing interface (Key for list: outgoing-interface)'
                    type: str
                    required: true
                  route_preference:
                    description: Numerical value that allows for comparing routes from different protocols. Also known as administrative-distance.
                    type: int
                    required: false
                key: name
            key: destination-prefix
          route_limit:
            description: Route limit specific attributes
            type: dict
            suboptions:
              address_family:
                description: List of route limit attributes per IP address-family
                type: list
                elements: dict
                suboptions:
                  type:
                    description: 'Address family type ; IPv4 or IPv6 (Key for list: address-family)'
                    type: str
                    required: true
                    choices:
                    - ipv4
                    - ipv6
                  maximum_routes:
                    description: Maximum selected route limit for the VRF
                    type: int
                    required: true
                  reinstall_threshold:
                    description: When the number of routes are decreasing, this attribute specifies the percentage value of the maximum-routes
                      limit at which point, previously withheld routes are reinstalled for the VRF Range; 0.00 - 100.00
                    type: float
                    required: true
                  warning_only:
                    description: If set, only a warning is issued when the VRF's maximum-routes limit is reached
                    type: bool
                    required: true
                  warning_threshold:
                    description: Percentage value of the maximum-routes limit indicating the high water mark Range; 0.00 - 100.00
                    type: float
                    required: true
                key: type
        key: name
