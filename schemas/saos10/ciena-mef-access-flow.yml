xml_namespace: urn:ciena:params:xml:ns:yang:ciena-pn::ciena-mef-access-flow
network_os: saos10
potential_modules:
  access_flows:
    description: List of access-flow configuration entries. Each entry defines an ACL rule specific to an interface.
    type: dict
    suboptions:
      access_flow:
        description: List of access-flow configuration entries. Each entry defines an ACL rule specific to an interface.
        type: list
        elements: dict
        suboptions:
          name:
            description: 'A unique string that is either system assigned or assigned by the user but does not change over its life. (Key for list:
              access-flow)'
            type: str
            required: true
          description:
            description: A more detailed description that an operator can use to describe the flow.
            type: str
            required: false
          augment_action:
            description: A list of Actions that may augment the filter-action of the Access-Flow/ACL-Rule.
            type: list
            elements: str
          classifier_list:
            description: A reference to a list of classifier entries.
            type: list
            elements: str
          classifier_list_precedence:
            description: A precedence value for the access flow. Lower values take precedence over higher values
            type: int
            required: false
          filter_action:
            description: Specifies the filter-action for this Access-Flow/ACL-Rule
            type: str
            required: false
            choices:
            - deny
            - allow
          logging:
            description: Determines whether ACL logging will be enabled or not for an access-flow
            type: str
            required: false
            choices:
            - enable
            - disable
          none:
            description: When the Access-Flow is an ACL rule in an Access-Profile, use none. In this case, the access-profile is referenced by
              a parent-interface instead.
            type: list
            required: false
            elements: str
            choices:
            - 'null'
          parent_fp:
            description: This is used when the Access-Flow is an ACL rule that is not part of an Access-Profile. In this case, the parent-interface
              defines the flow-point that the Access-Flow applies to
            type: list
            elements: str
          parent_port:
            description: This is used when the Access-Flow is an ACL rule that is not part of an Access-Profile. In this case, the parent-interface
              defines the port that the Access-Flow applies to
            type: list
            elements: str
          stats_collection:
            description: Determines whether stats collection will be turned on or not for an access-flow
            type: str
            required: false
            choices:
            - 'on'
            - 'off'
        key: name
  access_profiles:
    description: List of access-profile configuration templates. Each profile defines a list of ACL rules that can be applied to multiple interfaces.
    type: dict
    suboptions:
      access_profile:
        description: A list of all access-profile configuration entries.
        type: list
        elements: dict
        suboptions:
          name:
            description: 'A unique string that is either system assigned or assigned by the user but does not change over its life. (Key for list:
              access-profile)'
            type: str
            required: true
          description:
            description: A more detailed description that an operator can use to describe the profile.
            type: str
            required: false
          type:
            description: Type of interface this access-profile will attach to
            type: str
            required: false
            choices:
            - flow-point
            - IP-interface
          access_flow:
            description: A list of ACL rules, Access-Flows that are part of an access-profile. Each ACL-rule/Access-Flow specifies classifiers,
              precedence and actions independently
            type: list
            elements: dict
            suboptions:
              name:
                description: 'Access-Flow name (Key for list: access-flow)'
                type: str
                required: true
              description:
                description: A more detailed description that an operator can use to describe the flow.
                type: str
                required: false
              classifier:
                description: List of classifier templates. Classifiers can be referenced by various entities (flow-point/access-flow/qos-flow
                  etc.) to define their incoming classification.
                type: list
                elements: dict
                suboptions:
                  name:
                    description: 'A unique name for the classifier. (Key for list: classifier)'
                    type: str
                    required: true
                  filter_entry:
                    description: Add one filtering rule for this classifier.
                    type: list
                    elements: dict
                    suboptions:
                      filter_parameter:
                        description: 'Indicates which filter parameter is used by this filter entry (Key for list: filter-entry)'
                        type: str
                        required: true
                        choices:
                        - source-ip
                        - ip-fragment
                        - base-etype
                        - any
                        - local-termination
                        - destination-mac
                        - icmp
                        - ip-protocol
                        - dscp
                        - tcp-flags
                        - l4-application
                        - l4-destination-port
                        - destination-ip
                        - ip-version
                        - l4-source-port
                        - internal-cos
                        - vtag-stack
                        - mpls-label
                        - filter-param-type
                        - source-mac
                      any:
                        description: Accept any classification. Wide-Open classifier
                        type: list
                        required: false
                        elements: str
                        choices:
                        - 'null'
                      base_ethertype:
                        description: Base Ethernet type.
                        type: int
                        required: false
                      destination_address:
                        description: Classification on IP destination-address (v4/v6) and masking.
                        type: str
                        required: false
                      destination_mac:
                        description: Destination MAC address.
                        type: str
                        required: false
                      destination_mac_mask:
                        description: The mask of destination MAC address.
                        type: str
                        required: false
                      destination_max:
                        description: Maximum value of L4 destination port number.
                        type: int
                        required: false
                      destination_min:
                        description: Exact/Minimum value of L4 destination port number.
                        type: int
                        required: false
                      dscp_mask:
                        description: Allow DSCP values to be optionally coupled with a mask in a single classifier. Mutually exclusive to dscp-max
                        type: int
                        required: false
                      dscp_max:
                        description: The maximum value of DSCP for ranged DSCP values in a single classifier. Mutually exclusive to dscp-mask
                        type: int
                        required: false
                      dscp_min:
                        description: The minimum value of DSCP.
                        type: int
                        required: false
                      icmp_message_type:
                        description: ICMP Message type.
                        type: str
                        required: false
                        choices:
                        - echo-reply
                        - destination-unreachable
                        - redirect-message
                        - echo-request
                        - router-advertisement
                        - router-solicitation
                        - time-exceeded
                        - parameter-problem
                        - timestamp
                        - timestamp-reply
                      icmp_type:
                        description: ICMP type.
                        type: int
                        required: false
                      internal_cos:
                        description: To specify the Internal Class-Of-Service for the classifier.
                        type: int
                        required: false
                      internal_cos_mask:
                        description: Allow internal-COS values to be optionally coupled with a mask in a single classifier.
                        type: int
                        required: false
                      ip_fragment:
                        description: IP-fragment bit true/false
                        type: bool
                        required: false
                      ip_version:
                        description: To specify the IP version for the classifier.
                        type: str
                        required: false
                        choices:
                        - ipv4
                        - ipv6
                      l2cp_exclude_priority_tagged:
                        description: L2CP exclude priority tagged.
                        type: bool
                        required: false
                      l4_application:
                        description: L4 application.
                        type: str
                        required: false
                        choices:
                        - twamp
                      local_termination:
                        description: Classification of frames which are locally terminated.
                        type: bool
                        required: false
                      logical_not:
                        description: Opposite of what is specified in the filter-parameters. If the filter-parameter specifies a tpid as tpid-8100,
                          then anything other than tpid-8100 is considered an acceptable packet.
                        type: bool
                        required: false
                      max_prot:
                        description: Maximum value of IP protocol.
                        type: int
                        required: false
                      min_prot:
                        description: Exact/Minimum value of IP protocol.
                        type: int
                        required: false
                      mpls_labels:
                        description: List of MPLS labels.
                        type: list
                        elements: dict
                        suboptions:
                          label:
                            description: 'No description available (Key for list: mpls-labels)'
                            type: int
                            required: true
                          label_any:
                            description: Any value of mpls-label.
                            type: list
                            required: false
                            elements: str
                            choices:
                            - 'null'
                          mpls_label:
                            description: A specific value of mpls-label.
                            type: int
                            required: false
                          tc_any:
                            description: Any value of mpls TC.
                            type: list
                            required: false
                            elements: str
                            choices:
                            - 'null'
                          tc_value:
                            description: A specific value of mpls TC.
                            type: int
                            required: false
                        key: label
                      source_address:
                        description: Classification on IP source-address (v4/v6) and masking.
                        type: str
                        required: false
                      source_mac:
                        description: Source MAC address.
                        type: str
                        required: false
                      source_mac_mask:
                        description: The mask of source MAC address.
                        type: str
                        required: false
                      source_max:
                        description: Maximum value of L4 source port number.
                        type: int
                        required: false
                      source_min:
                        description: Exact/Minimum value of L4 source port number.
                        type: int
                        required: false
                      tcp_flags:
                        description: List of TCP flags.
                        type: list
                        required: false
                        elements: str
                        choices:
                        - fin
                        - syn
                        - rst
                        - psh
                        - ack
                        - urg
                        - ece
                        - cwr
                        - ns
                      untagged_exclude_priority_tagged:
                        description: Untagged exclude priority tagged.
                        type: bool
                        required: false
                      vtags:
                        description: List of VLAN tags.
                        type: list
                        elements: dict
                        suboptions:
                          tag:
                            description: '''1'' represents outer most tag, ''2'' next outer most, etc (Key for list: vtags)'
                            type: int
                            required: true
                          dei:
                            description: Discard Eligibility Indication
                            type: str
                            required: false
                            choices:
                            - discard-eligible
                            - not-discard-eligible
                          pcp:
                            description: A specific value of VLAN Tag PCP.
                            type: int
                            required: false
                          pcp_mask:
                            description: Allow PCP values to be optionally coupled with a mask in a single classifier
                            type: int
                            required: false
                          tpid:
                            description: A specific value of VLAN Tag EtherType.
                            type: str
                            required: false
                            choices:
                            - tpid-8100
                            - tpid-88a8
                            - tpid-9100
                          vlan_id:
                            description: A specific value of VLAN Tag VLAN-ID.
                            type: int
                            required: false
                          vlan_id_max:
                            description: The maximum value of VLAN ID for ranged VLAN-ID values.
                            type: int
                            required: false
                        key: tag
                    key: filter-parameter
                  filter_operation:
                    description: Choose the scope of application of the rule
                    type: str
                    required: false
                    choices:
                    - match-all
                    - match-any
                key: name
              classifier_list_precedence:
                description: A precedence value for the access flow. Lower values take precedence over higher values
                type: int
                required: false
              filter_action:
                description: Specifies the filter-action for this Access-Flow/ACL-Rule
                type: str
                required: false
                choices:
                - deny
                - allow
              logging:
                description: Determines whether ACL logging will be enabled or not for an access-flow
                type: str
                required: false
                choices:
                - enable
                - disable
              stats_collection:
                description: Determines whether stats collection will be turned on or not for an access-flow
                type: str
                required: false
                choices:
                - 'on'
                - 'off'
            key: name
          base_access_profile:
            description: An Access Profile should be able to refer to another Access Profile and inherit its properties
            type: str
            required: false
          default_filter_action:
            description: Specifies the default filter-action for this Access-Profile
            type: str
            required: false
            choices:
            - deny
            - allow
          default_filter_logging:
            description: Determines whether logging will be enabled or not for default filter of access-profile
            type: str
            required: false
            choices:
            - enable
            - disable
          default_filter_stats_collection:
            description: Determines whether stats collection will be turned on or not for default filter of access-profile
            type: str
            required: false
            choices:
            - 'on'
            - 'off'
          logging:
            description: Determines whether logging will be enabled or not for an instance of access-profile
            type: str
            required: false
            choices:
            - enable
            - disable
          stats_collection:
            description: Determines whether stats collection will be turned on or not for an instance of access-profile
            type: str
            required: false
            choices:
            - 'on'
            - 'off'
        key: name
  acl_actions:
    description: List of ACL actions.
    type: dict
    suboptions:
      acl_action:
        description: A list of ACL-actions, where each ACL-action specifies the action of the classified flow.
        type: list
        elements: dict
        suboptions:
          name:
            description: 'A unique string that is either system assigned or assigned by the user but does not change over its life. (Key for list:
              acl-action)'
            type: str
            required: true
          description:
            description: A more detailed description that an operator can use to describe the action.
            type: str
            required: false
          action:
            description: Specifies an action for this acl action
            type: str
            required: false
            choices:
            - redirect
            - ingress-mirror
          custom:
            description: One or more custom destinations which act as destination for the acl-action (e.g. mirror/redirect)
            type: list
            elements: str
          flow_point:
            description: One or more flow-points which act as destination for the acl-action (e.g. mirror/redirect)
            type: list
            elements: str
          logical_port:
            description: One or more logical-ports which act as destination for the acl-action (e.g. mirror/redirect)
            type: list
            elements: str
        key: name
  acl_custom_destinations:
    description: List of custom destinations. A given ACL rule may be redirecting/mirroring to one or more destinations.
    type: dict
    suboptions:
      acl_custom_destination:
        description: A list of ACL-customized-destinations that the classified flows may be directed to.
        type: list
        elements: dict
        suboptions:
          name:
            description: 'A unique string that is either system assigned or assigned by the user but does not change over its life. (Key for list:
              acl-custom-destination)'
            type: str
            required: true
          description:
            description: A more detailed description that an operator can use to describe the custom destination.
            type: str
            required: false
          destination:
            description: Specifies an application name for this acl destination
            type: str
            required: false
            choices:
            - voltha-agent
        key: name
  acl_logging:
    description: 'Configures ACL logging global parameters '
    type: dict
    suboptions:
      acl_logging_timer:
        description: Logging interval in seconds after which packets hitting ACL will be logged.
        type: int
        required: false
