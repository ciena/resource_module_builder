xml_namespace: http://www.ciena.com/ns/yang/ciena-packet-xcvr
network_os: saos10
potential_modules:
  xcvrs:
    description: Transceivers (XCVR) configuration and operational data.
    type: dict
    suboptions:
      xcvr:
        description: Transceiver (XCVR) list.
        type: list
        elements: dict
        suboptions:
          xcvr_id:
            description: 'Unique, access identifier string of the XCVR (e.g. ''1/1''). Key value for the XCVR List. (Key for list: xcvr)'
            type: str
            required: true
          properties:
            description: All the Configurable and operational data of this XCVR instance.
            type: dict
            suboptions:
              mode:
                description: Mode of the XCVR.
                type: str
                required: true
                choices:
                - blank
                - auto
                - 100M
                - 1GE
                - 10GE
                - 25GE
                - 40GE
                - 100GE
                - 400GE
                - 35-100
                - 35-200
                - 56-100
                - 56-200
                - 56-300
                - 56-400
                - 28-100
                - 32-100
                - 32-200
                - DS1-E1
                - DS3-E3
                - OC3-STM1
                - OC12-STM4
                - OC48-STM16
                - NATIVE-OC3-STM1
                - NATIVE-OC12-STM4
                - NATIVE-OC48-STM16
                - 200GE
                - 31.5-100
                - 31.5-200
                - 63-200
                - 63-400
                - 70-400
                - 400GZR
                - 400GZR+
                - PKT-MAX-200
                - PKT-MAX-400
                - 58-200
                - 70-400-E
                - 65-400-E
                - 60-400-E-ZR
                - 60-400-E-ZR+
                - 50GE
                - PKT-MAX-70400E
              fec_type:
                description: FEC type of the XCVR.
                type: str
                required: false
                choices:
                - GFEC
                - EFEC
          state:
            description: State information of this XCVR instance.
            type: dict
            suboptions:
              admin_state:
                description: Whether Admin State is enabled or disabled for this XCVR's PTP.
                type: str
                required: false
                choices:
                - disabled
                - enabled
        key: xcvr-id
